    "founding-four-recap": `
      <p>Four teams walked into the inaugural PuckGold Founding Four Championship. One team was supposed to walk out with the Cup. It wasn't the one anybody picked.</p>
      <p>This is the story of Season One — from the opening faceoff at Terminal Arena to the golden confetti falling on Neon Reef Stadium three nights later.</p>
      <h2>The Field</h2>
      <p><strong>McLean Cardinals</strong> — disciplined, defense-first, built to win from day one. <strong>Washington Whoomp!</strong> — tactical, the quiet overachiever. <strong>Miami Mighty Geckz</strong> — fast, flashy, completely unproven. <strong>Chattanooga Choo Choo</strong> — physical, blue-collar, everybody's second favorite.</p>
      <p class="pull">Nobody had played a competitive game as a franchise. By Sunday night, one of them had a trophy.</p>
      <h2>Round Robin — The Empire Looks Unbeatable</h2>
      <p>McLean announced itself immediately: 4–1 over Chattanooga at Terminal Arena, then 5–2 over Washington at Cardinal Perch Gardens. Closing the robin 3–0 didn't feel like a hot start — it felt like a coronation. Nine goals for, five against.</p>
      <p>Washington did what a #2 seed does: OT win over Miami in Game 1, then 4–3 over Chattanooga. Miami opened with that OT loss, bounced back 4–2 at Neon Reef, and needed a miracle just to survive a 3–2 loss to McLean in Game 6 — sneaking into the #3 seed on goal differential.</p>
      <table>
        <thead><tr><th>Seed</th><th>Team</th><th>Record</th><th>PTS</th><th>GD</th></tr></thead>
        <tbody>
          <tr><td>1</td><td>McLean Cardinals</td><td>3–0–0</td><td>9</td><td>+7</td></tr>
          <tr><td>2</td><td>Washington Whoomp!</td><td>2–1–0</td><td>6</td><td>−1</td></tr>
          <tr><td>3</td><td>Miami Mighty Geckz</td><td>1–1–1</td><td>4</td><td>0</td></tr>
          <tr><td>4</td><td>Chattanooga Choo Choo</td><td>0–3–0</td><td>0</td><td>−6</td></tr>
        </tbody>
      </table>
      <h2>Semifinals — One Chalk, One Chaos</h2>
      <p><strong>McLean 6, Chattanooga 2</strong> went as advertised. <strong>Miami 3, Washington 2 (OT)</strong> was the gut-punch — #3 knocking out #2 on a clutch breakaway.</p>
      <h2>Golden Final</h2>
      <p><strong>Game 1 · Cardinal Perch:</strong> McLean 3, Miami 1. Clinical. Aggregate 3–1 Empire.</p>
      <p><strong>Game 2 · Neon Reef — “The Miracle Game”:</strong> McLean up 2–0 early (5–1 agg). Miami clawed back. Third period: three unanswered. Aggregate knotted 6–6. Overtime: rebound breakaway, triple-deke, top shelf.</p>
      <p class="pull">FINAL: Miami 5, McLean 4 (OT) · Aggregate Miami 6–5 · First-ever PuckGold Champions.</p>
      <p>McLean played the better hockey for five and a half of six Golden Final periods. It didn't matter. That's the pitch: <strong>nobody's out of it until the horn sounds.</strong></p>
      <p>Read the <a href="founding-four.html">Championship Book</a> · period-by-period <a href="news-article.html?id=miracle-game">Miracle Game</a> · hardware on <a href="awards.html">awards.html</a> · source PDF in <a href="assets/lore/founding-four/Founding-Four-Recap-How-Miami-Stole-The-Cup.pdf">lore vault</a>.</p>`,

    "miracle-game": `
      <p>Entering Game 2 of the Golden Final, McLean led the aggregate <strong>3–1</strong>. Neon Reef was survival mode for everyone else.</p>
      <h2>1st Period — The Cup feels decided</h2>
      <p>McLean doesn't blink. Two power-play goals. Game 2–0 Cardinals. Aggregate <strong>5–1</strong>. Miami's building goes quiet for the first time all tournament. Coronation copy starts writing itself.</p>
      <h2>2nd Period — A pulse</h2>
      <p>Miami power-play goal, then a converted penalty shot. Game 3–2 McLean. Aggregate still <strong>6–3</strong>. By any reasonable measure, finished. By Miami measure: alive.</p>
      <h2>3rd Period — The period Season One is remembered for</h2>
      <p>Three unanswered Geckz goals. The building shakes louder with every one. Game tied 4–4. Aggregate knotted <strong>6–6</strong> with under a minute left. McLean nearly wins it in regulation. They don't.</p>
      <h2>Overtime — Triple-deke, top shelf</h2>
      <p>McLean presses. Shot blocked. Rebound springs Miami on a clean breakaway. Signature move of the tournament: <strong>triple-deke, buried top shelf.</strong></p>
      <p class="pull">Miami 5, McLean 4 (OT) · Aggregate 6–5 · Golden confetti · First champions.</p>
      <p>Clip Crown energy. Clutch Award. Golden Gecko night. Watch path: <a href="video-recaps.html">recaps</a> · <a href="scores.html">scores</a> · <a href="founding-four.html">championship book</a>.</p>`,

    "empire-fallen": `
      <p>For five and a half of the six periods in the Golden Final, the McLean Cardinals played the better hockey. Depth. Discipline. Suffocating structure. Game 1 was a statement: 3–1 at Cardinal Perch Gardens. Game 2's first period looked like a coronation — two power-play goals, aggregate 5–1.</p>
      <p>Then Neon Reef remembered who it is.</p>
      <p>Empires don't lose on paper. They lose when a #3 seed that needed a tiebreaker just to make the playoffs decides the horn hasn't sounded yet. McLean takes home The Wall Trophy and the Golden Finalist Plate. Miami takes the Cup.</p>
      <p>Redemption path starts this weekend — <a href="expansion.html">Expansion Weekend</a> puts the Empire back on the ice with twelve new invite markets watching.</p>`,

    "choochoo-heart": `
      <p>Zero points. Zero wins. Everything in the fans' hearts.</p>
      <p>Chattanooga Choo Choo left the Founding Four round robin 0–3–0 and still skated off as the league's blue-collar conscience — three physical, hard-nosed losses that never once looked like a basement team. The Conductor's Crest (sportsmanship) was never a consolation prize. It was the truth of the weekend.</p>
      <p>Terminal Arena hosted the tournament's opening night. The steam-whistle horn still owns the highlight packages. This weekend, the Railroad Rebels ride again in the First 16.</p>
      <p><a href="team.html?team=chattanooga-choo-choo">Team vault</a> · <a href="awards.html#conductors-crest">Conductor's Crest</a> · <a href="expansion.html">Expansion pools</a>.</p>`,

      <p>Enter the farm: <a href="signin.html">create your vibe</a> · <a href="fantasy.html#prizes">prize vault</a> · <a href="checkout.html?offer=og">unlock 5×</a> · countdown on <a href="expansion.html">expansion.html</a>.</p>`,

    "expansion-24h": `

      <p>Faceoff rides the <a href="expansion.html">sitewide countdown</a>. That clock also drives the founding sales window: free limited gold puck + Premium League Pass, weekend jersey energy, and gift cards for the group chat.</p>
      <p>Catch up on lore: <a href="founding-four.html">How Miami stole the Cup</a>. Press: <a href="media-guide.html">2026 Media Guide</a>. Fans: <a href="checkout.html?offer=og">lock the founding offer</a> before the horn.</p>`,

    "golden-final-recap": `
      <p>McLean took Game 1, 3–1. Neon Reef answered.</p>
      <p>Game 2 went to overtime — Miami 5–4 — and the aggregate flipped to <strong>6–5 Geckz</strong>. The triple-deke OT winner becomes Clip Crown lore; the Golden Gecko writes itself.</p>

    "media-guide-drop": `

      <p>Drop <code>main.mp3</code> into <code>assets/teams/miami-mighty-geckz/09-Audio/</code>. Blast the horn from the <a href="team.html?team=miami-mighty-geckz#audio">team vault page</a>. More shows on <a href="podcasts.html">podcasts</a>.</p>`,
