<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transcripts — PuckGold Media</title>
<meta name="description" content="PuckGold press conference transcripts and quick quotes by tournament — ASAP Sports style.">
<script>(function(){try{var t=localStorage.getItem("pgb-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);else if(window.matchMedia("(prefers-color-scheme: light)").matches)document.documentElement.setAttribute("data-theme","light");}catch(e){}})();</script>
<link rel="stylesheet" href="assets/css/site.css?v=45">
<link rel="stylesheet" href="assets/css/media-hub.css?v=3">
<link rel="stylesheet" href="assets/css/transcripts.css?v=1">
<link rel="icon" href="assets/brand/favicon/favicon.ico?v=3" type="image/x-icon">
</head>
<body class="mh-page tr-light" data-mh="transcripts">
<div class="ice-lines"></div>
<header class="site-header" id="site-header"></header>
<div class="mh-subnav" id="mhSubnav"></div>

<section class="mh-page-hero">
  <h1>2026 TRANSCRIPTS</h1>
</section>

<div class="mh-wrap" style="padding-bottom:0">
  <p class="mh-legal" style="text-align:center;margin:0 auto 1rem">
    Press conferences, quick quotes, and TV availabilities by event — desk style from
    <a href="https://asaptext.com/orgs/livgolf/" style="color:#163a74;text-decoration:underline">ASAP / LIV Golf transcripts</a>.
    Drop PDF/HTML exports into <code>assets/vault/content/transcripts/{event}/</code>.
  </p>
</div>

<div class="tr-events" id="trEvents"></div>

<p style="text-align:center;padding:0 4vw 2.5rem;font-size:.82rem;color:#5c6473">
  For more media information see <a href="media.html" style="color:#163a74;font-weight:800">PuckGold Media Hub</a>
  · <a href="media-videos.html" style="color:#163a74;font-weight:800">Videos</a>
  · <a href="media-guide.html" style="color:#163a74;font-weight:800">Media Guide</a>
</p>

<footer class="site-footer" id="site-footer"></footer>
<script src="assets/js/i18n.js?v=1"></script>
<script src="assets/js/site.js?v=45"></script>
<script src="assets/js/support-widget.js?v=5"></script>
<script src="assets/js/cart.js?v=8"></script>
<script src="assets/js/media-hub.js?v=3"></script>
<script src="assets/js/transcripts-data.js?v=1"></script>
<script>
(function () {
  document.getElementById("trEvents").innerHTML = window.PGBTranscripts.events()
    .map(
      (e) => `
    <a class="tr-event" href="transcripts-event.html?event=${e.id}">
      <div class="tr-roundel" style="box-shadow:0 0 0 3px ${e.accent}33">
        <img src="${e.logo}" alt="${e.name}" width="160" height="160"
          onerror="this.style.display='none';this.nextElementSibling.hidden=false">
        <div class="fallback" hidden>
          <div class="pgb">PUCK GOLD</div>
          <div class="city">${e.city}</div>
          <div class="leaf" style="background:${e.accent}">${e.num}</div>
          <div class="date">${e.dates}</div>
        </div>
      </div>
      <span>${e.name}</span>
    </a>`
    )
    .join("");
})();
</script>
</body>
</html>
