  <p>Championship Book energy — how Miami stole the Cup, Miracle Game lore, Expansion Weekend prizes, booth drops, and the Media Guide.</p>

<footer class="site-footer" id="site-footer"></footer>
<script src="assets/js/i18n.js?v=1"></script>

<script>
(function () {
  const items = window.PGBNews.all();
  const hero = items.find((n) => n.hero) || items[0];
  const rest = items.filter((n) => n !== hero);
  document.getElementById("newsRoot").innerHTML = `
    <a class="news-hero" href="${hero.href}" style="display:block;text-decoration:none;color:inherit">
      <div class="cat">${hero.cat} · ${hero.date}</div>
      <h2>${hero.title}</h2>
      <p>${hero.dek}</p>
      <span class="btn btn-platinum btn-sm" style="margin-top:1rem;display:inline-flex">Read →</span>
    </a>
    <div class="news-grid">
      ${rest
        .map(
          (n) => `
        <a class="news-card" href="${n.href}">
          <div class="cat">${n.cat} · ${n.date}</div>
          <h3>${n.title}</h3>
          <p>${n.dek}</p>
        </a>`
        )
        .join("")}
    </div>
    <p style="margin-top:1.5rem;font-size:.82rem;color:#5c6473">
      Drop article art into <code style="color:#163a74">assets/vault/content/news/{id}/hero.jpg</code>.
      Replay masters still land in condensed/recaps game folders.
    </p>
  `;
})();
</script>
</body>
</html>
