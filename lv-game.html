<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Game Outfit — LockerVision | PuckGold</title>
<meta name="description" content="Game-night hockey outfits — jersey, pads, helmet, and ice rink for each Founding Four matchup.">
<script>(function(){try{var t=localStorage.getItem("pgb-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);else if(window.matchMedia("(prefers-color-scheme: light)").matches)document.documentElement.setAttribute("data-theme","light");}catch(e){}})();</script>
<link rel="stylesheet" href="assets/css/site.css?v=44">
<link rel="stylesheet" href="assets/css/lockervision.css?v=2">
<meta name="theme-color" content="#0a0c10">
<link rel="icon" href="assets/brand/favicon/favicon.ico?v=3" type="image/x-icon">
</head>
<body class="lv-body">
<div class="ice-lines"></div>
<header class="site-header" id="site-header"></header>
<div id="lvSubnav"></div>
<div id="lvTeamBar"></div>

<div class="lv-wrap lv-wrap-wide" id="lvRoot">
  <p style="color:rgba(255,255,255,.5)">Loading outfit…</p>
</div>

<footer class="site-footer" id="site-footer"></footer>
<script src="assets/js/i18n.js?v=1"></script>
<script src="assets/js/site.js?v=44"></script>
<script src="assets/js/support-widget.js?v=5"></script>
<script src="assets/js/cart.js?v=8"></script>
<script src="assets/js/teams-data.js?v=2"></script>
<script src="assets/js/standings-data.js?v=2"></script>
<script src="assets/js/lockervision-data.js?v=2"></script>
<script src="assets/js/lockervision.js?v=2"></script>
<script>
(function () {
  const UI = window.PGBLVUI;
  const LV = window.PGBLockerVision;
  const params = new URLSearchParams(location.search);
  const gameId = params.get("gameid") || (window.PGB_GAMES || [])[0]?.id;
  let side = params.get("side") === "away" ? "away" : "home";

  document.getElementById("lvSubnav").innerHTML = UI.subnav("schedule");

  const g = (window.PGB_GAMES || []).find((x) => x.id === gameId) || window.PGB_GAMES[0];
  if (!g) return;
  const eg = LV.enrichGame(g);
  const focusSlug = side === "away" ? g.away : g.home;
  const otherSlug = side === "away" ? g.home : g.away;
  const team = LV.teamBySlug(focusSlug);
  const other = LV.teamBySlug(otherSlug);
  const kitId = side === "away" ? eg.awayKit : eg.homeKit;
  const kit = LV.kitFor(focusSlug, kitId);
  const outfitName = side === "away" ? g.outfitAway : g.outfitHome;
  const slots = kitId === "goalie" ? LV.goalieSlots : LV.gearSlots;
  const paths = LV.paths(focusSlug, kitId);

  document.title = `${team.name} — ${outfitName} · LockerVision`;
  document.getElementById("lvTeamBar").innerHTML = UI.teamFilterBar(focusSlug);

  const d = new Date(g.date + "T12:00:00");
  const dateLabel = d.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", year: "numeric" });

  const root = document.getElementById("lvRoot");
  const otherSide = side === "home" ? "away" : "home";
  const otherHref = `lv-game.html?gameid=${encodeURIComponent(g.id)}&side=${otherSide}`;

  root.innerHTML = `
    <div class="lv-crumb">
      <span class="lv-gc-mono" style="background:${team.colorDeep};width:28px;height:28px;font-size:.75rem">${team.mono}</span>
      <strong style="color:#fff">${team.short}</strong>
      <span aria-hidden="true">·</span>
      <span>${dateLabel}</span>
      <span aria-hidden="true">·</span>
      <span>${g.label}</span>
    </div>

    <div class="lv-detail">
      <div>
        <div class="lv-main-card">
          <div class="lv-main-visual" id="lvHero">
            <img id="lvHeroImg" alt="${outfitName}" hidden>
            <div class="lv-kit-fallback" id="lvHeroFall">${UI.kitSilhouette(team, kit)}</div>
          </div>
          <div class="lv-rink-panel">
            <h4>Ice rink · ${g.venue}</h4>
            <div id="lvRink">${UI.rinkSvg(team)}</div>
          </div>
        </div>
      </div>
      <div class="lv-info">
        <div style="font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.45);margin-bottom:.35rem">Uniform details</div>
        <h2>${outfitName}</h2>
        <div class="lv-actions">
          <a href="lv-schedule.html">Schedule</a>
          <a href="${otherHref}">${side === "home" ? "Away" : "Home"} · ${other.short}</a>
          <a class="primary" href="shop.html?filter=${encodeURIComponent(team.shopFilter || "")}">Shop</a>
          <a href="lv-outfit.html?team=${encodeURIComponent(team.slug)}&kit=${kitId}">Kit story</a>
        </div>
        <p>${kit?.story || ""}</p>
        <p style="margin-top:.75rem;font-size:.82rem">
          <strong style="color:#fff">${g.score}</strong> · ${g.round}
          ${g.threeStars?.length ? " · Stars: " + g.threeStars.join(", ") : ""}
        </p>

        <div class="lv-section-head" style="margin-top:1.25rem">
          <h2 style="font-size:1.15rem">Game outfitting</h2>
        </div>
        <p style="font-size:.82rem;margin-bottom:.5rem">Jersey, pads, helmet, gloves, skates — layer art drops replace these swatches.</p>
        <div class="lv-gear-grid" id="lvGear"></div>
      </div>
    </div>
    ${UI.mobileDock([
      { href: otherHref, label: side === "home" ? `Away · ${other.short}` : `Home · ${other.short}` },
      { href: `shop.html?filter=${encodeURIComponent(team.shopFilter || "")}`, label: "Shop", primary: true },
    ])}
  `;

  UI.resolveKitHero(focusSlug, kitId, g.id, side, document.getElementById("lvHeroImg"), document.getElementById("lvHeroFall"));

  // Optional rink photo
  const rinkImg = new Image();
  rinkImg.onload = () => {
    document.getElementById("lvRink").innerHTML = `<img src="${paths.rink}" alt="${g.venue} rink map">`;
  };
  rinkImg.src = paths.rink;

  const gear = document.getElementById("lvGear");
  gear.innerHTML = slots
    .map((s) => {
      const src = paths[s.id];
      return `
        <div class="lv-gear" data-src="${src}">
          <span class="tag">${s.label}</span>
          <div class="swatch" style="background:linear-gradient(145deg,${kit?.accent || team.color},${kit?.shell || team.colorDeep})"></div>
          <img alt="" hidden>
          <strong>${s.label}</strong>
        </div>`;
    })
    .join("");

  gear.querySelectorAll(".lv-gear").forEach((el) => {
    const img = el.querySelector("img");
    const sw = el.querySelector(".swatch");
    UI.tryImages([el.dataset.src], (src) => {
      img.src = src;
      img.hidden = false;
      if (sw) sw.hidden = true;
    });
  });
})();
</script>
</body>
</html>
