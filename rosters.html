<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rosters — PuckGold Founding Four</title>
<script>(function(){try{var t=localStorage.getItem("pgb-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);else if(window.matchMedia("(prefers-color-scheme: light)").matches)document.documentElement.setAttribute("data-theme","light");}catch(e){}})();</script>
<link rel="stylesheet" href="assets/css/site.css?v=58">
<link rel="stylesheet" href="assets/css/teams.css?v=2">
<link rel="icon" href="assets/brand/favicon/favicon.ico?v=3" type="image/x-icon">
</head>
<body class="tp-page">
<div class="ice-lines"></div>
<header class="site-header" id="site-header"></header>

<section class="tp-hero">
  <span class="kicker" style="color:#f0d78c">Teams &amp; Players</span>
  <h1>LEAGUE ROSTERS</h1>
  <p>Every Founding Four lineup — tap a player for a full profile, or open a team site for the RangeGoats-style experience.</p>
</section>

<div class="tp-wrap" id="rosterRoot"></div>

<footer class="site-footer" id="site-footer"></footer>
<script src="assets/js/i18n.js?v=1"></script>
<script src="assets/js/site.js?v=64"></script>
<script src="assets/js/support-widget.js?v=12"></script>
<script src="assets/js/cart.js?v=8"></script>
<script src="assets/js/teams-data.js?v=2"></script>
<script>
(function () {
  const root = document.getElementById("rosterRoot");
  root.innerHTML = window.PGBTeams.all()
    .map((t) => `
      <section style="margin-bottom:2.4rem" id="${t.slug}">
        <div style="display:flex;flex-wrap:wrap;gap:.7rem;justify-content:space-between;align-items:flex-end;margin-bottom:1rem">
          <div>
            <div style="font-size:.68rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:${t.colorDeep}">${t.city}</div>
            <h2 style="font-family:var(--display);font-size:2.2rem;letter-spacing:.04em">${t.name}</h2>
          </div>
          <a class="tp-btn" href="team.html?team=${t.slug}#roster">Team roster page</a>
        </div>
        <div class="roster-grid">
          ${t.players
            .map(
              (p) => `
            <a class="roster-card" href="player.html?id=${p.id}" style="text-decoration:none;color:inherit">
              <div class="roster-viz" style="background:linear-gradient(160deg,${t.color},${t.colorDeep})">
                <span class="num">#${p.num}</span>
                <div class="avatar">${p.name.split(" ").map((n) => n[0]).join("")}</div>
              </div>
              <div class="roster-body">
                <div class="pos">${p.pos} · ${p.role}</div>
                <h3>${p.name}</h3>
                <div class="roster-meta">
                  <div><span>Rank</span><strong>${p.rank}</strong></div>
                  <div><span>Pts</span><strong>${p.pts}</strong></div>
                </div>
                <span class="link">Player profile ›</span>
              </div>
            </a>`
            )
            .join("")}
        </div>
      </section>`)
    .join("");
})();
</script>
</body>
</html>
