<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player — PuckGold</title>
<script>(function(){try{var t=localStorage.getItem("pgb-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);else if(window.matchMedia("(prefers-color-scheme: light)").matches)document.documentElement.setAttribute("data-theme","light");}catch(e){}})();</script>
<link rel="stylesheet" href="assets/css/site.css?v=60">
<link rel="stylesheet" href="assets/css/teams.css?v=3">
<link rel="icon" href="assets/brand/favicon/favicon.ico?v=3" type="image/x-icon">
</head>
<body class="tp-page">
<div class="ice-lines"></div>
<header class="site-header" id="site-header"></header>
<div id="playerRoot"></div>
<footer class="site-footer" id="site-footer"></footer>
<script src="assets/js/i18n.js?v=1"></script>
<script src="assets/js/site.js?v=60"></script>
<script src="assets/js/support-widget.js?v=11"></script>
<script src="assets/js/cart.js?v=8"></script>
<script src="assets/js/teams-data.js?v=2"></script>
<script src="assets/js/player-bites.js?v=1"></script>
<script>
(function () {
  const id = new URLSearchParams(location.search).get("id") || "kai-sandoval";
  const hit = window.PGBTeams.player(id);
  if (!hit) {
    document.getElementById("playerRoot").innerHTML =
      `<div class="tp-wrap"><p>Player not found. <a href="teams.html" style="color:#163a74;text-decoration:underline">Back to teams</a></p></div>`;
    return;
  }
  const { player: p, team: t } = hit;
  document.title = p.name + " | " + t.short + " | PuckGold";
  const biteSrc = (window.PGB_PLAYER_BITES && window.PGB_PLAYER_BITES[p.id]) || "";

  const mates = t.players
    .filter((x) => x.id !== p.id)
    .map(
      (x) =>
        `<a href="player.html?id=${x.id}"><span>#${x.num} ${x.name}</span><span>${x.pos}</span></a>`
    )
    .join("");

  document.getElementById("playerRoot").innerHTML = `
    <section class="player-hero">
      <div style="position:absolute;inset:0;background:linear-gradient(120deg,${t.colorDeep},${t.color} 50%,#0b1220)"></div>
      <div class="player-hero-inner">
        <div class="player-avatar" aria-hidden="true">${p.name.split(" ").map((n) => n[0]).join("")}</div>
        <div>
          <a class="team-link" href="team.html?team=${t.slug}">${t.name}</a>
          <h1>${p.name}</h1>
          <p style="margin-top:.4rem;opacity:.9">${p.role} · #${p.num} · ${p.pos} · ${t.city}</p>
          <div class="player-stats">
            <div><span>Season pos</span><strong>${p.rank}</strong></div>
            <div><span>Points</span><strong>${p.pts}</strong></div>
            <div><span>Number</span><strong>${p.num}</strong></div>
            <div><span>Position</span><strong>${p.pos}</strong></div>
          </div>
        </div>
      </div>
    </section>

    <div class="player-body">
      <div>
        <div class="player-panel">
          <h2>Biography</h2>
          <p>${p.bio}</p>
          <p style="margin-top:.9rem">${p.name} represents ${t.name} at ${t.arena}. Drop a full profile photo and extended bio in <code>${t.folder}players/</code> and <code>profiles/</code>.</p>
        </div>
        <div class="player-panel player-voice" style="margin-top:1rem">
          <h2>Voice bite</h2>
          <p>Chatterbox interview line from the Founding Four pack — tap play, then farm more on Listen.</p>
          ${
            biteSrc
              ? `<audio id="playerBite" controls preload="metadata" src="${biteSrc}"></audio>
                 <div class="player-voice-links">
                   <a class="tp-btn" href="listen.html?show=founding-four-player-bites">All 36 bites</a>
                   <a class="tp-btn ghost" href="listen.html?show=voice-roster-showcase">Voice Roster</a>
                 </div>`
              : `<p class="player-voice-miss">Bite dropping soon.</p>`
          }
        </div>
        <div class="player-panel" style="margin-top:1rem">
          <h2>2026 Snapshot</h2>
          <p>Founding Four Season One tracking — points and rank update as events complete. Follow the live path on the <a href="bracket.html" style="color:#163a74;text-decoration:underline">leaderboard</a> and <a href="media-schedule.html" style="color:#163a74;text-decoration:underline">schedule</a>.</p>
        </div>
      </div>
      <aside>
        <div class="player-panel">
          <h2>${t.short}</h2>
          <p style="margin-bottom:.8rem">Explore all things ${t.short} — roster, shop, and team site.</p>
          <a class="tp-btn" href="team.html?team=${t.slug}" style="display:inline-flex;margin-bottom:.8rem">Team site</a>
          <div class="mate-list">${mates}</div>
        </div>
      </aside>
    </div>
  `;
})();
</script>
</body>
</html>
