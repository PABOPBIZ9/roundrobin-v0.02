<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team — PuckGold</title>
<script>(function(){try{var t=localStorage.getItem("pgb-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);else if(window.matchMedia("(prefers-color-scheme: light)").matches)document.documentElement.setAttribute("data-theme","light");}catch(e){}})();</script>
<link rel="stylesheet" href="assets/css/site.css?v=88">
<link rel="stylesheet" href="assets/css/teams.css?v=6">
<link rel="icon" href="assets/brand/favicon/favicon.ico?v=3" type="image/x-icon">
<style>
  .vault-grid{display:grid;gap:.75rem;grid-template-columns:1fr}
  @media(min-width:700px){.vault-grid{grid-template-columns:1fr 1fr}}
  @media(min-width:1000px){.vault-grid.cols-3{grid-template-columns:repeat(3,1fr)}}
  .vault-card{
    background:#fff;border:1px solid rgba(18,24,38,.08);border-radius:14px;padding:1.15rem;
    min-height:120px;display:flex;flex-direction:column;gap:.45rem;
  }
  .vault-card .tag{font-size:.62rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#8a93a3}
  .vault-card h3{font-size:1.05rem}
  .vault-card p{font-size:.86rem;color:#5c6473;line-height:1.45;flex:1}
  .vault-card a{font-size:.78rem;font-weight:800;color:#163a74;text-decoration:underline;text-underline-offset:3px}
  .vault-card.drop{
    border-style:dashed;border-color:rgba(22,58,116,.28);background:#f8fafc;color:#5c6473;
    align-items:center;justify-content:center;text-align:center;
  }
  .vault-card.drop strong{display:block;color:#0b1220;margin-bottom:.25rem}
  .audio-box{
    background:#0b1220;color:#fff;border-radius:14px;padding:1.3rem;display:grid;gap:.85rem;
  }
  @media(min-width:800px){.audio-box{grid-template-columns:1.1fr 1fr}}
  .horn-btn{
    border-radius:999px;padding:1em 1.4em;border:none;cursor:pointer;
    background:linear-gradient(180deg,#f0d78c,#d4af37 55%,#8a6a1e);color:#1a1400;
    font-weight:900;letter-spacing:.08em;text-transform:uppercase;font-size:.78rem;
  }
  .booth-list{display:grid;gap:.55rem}
  .booth-item{
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
    border-radius:10px;padding:.75rem .85rem;
  }
  .booth-item b{display:block;font-size:.9rem;margin-bottom:.35rem}
  .booth-item span{font-size:.78rem;color:rgba(255,255,255,.65)}
  .booth-item audio{width:100%;margin-top:.35rem;border-radius:8px}
  .booth-item .miss{font-size:.72rem;color:rgba(255,255,255,.45);margin-top:.3rem}
  .map-note{
    margin:0 4vw 2.5rem;max-width:1200px;margin-left:auto;margin-right:auto;
    background:#fff;border:1px solid rgba(18,24,38,.08);border-radius:14px;padding:1.2rem 1.3rem;
    font-size:.9rem;color:#5c6473;
  }
  .map-note code{color:#163a74;font-size:.82rem}
  .stadium-vid-grid{display:grid;gap:1rem}
  @media(min-width:900px){.stadium-vid-grid{grid-template-columns:repeat(3,1fr)}}
  .stadium-vid{
    background:#0b1220;border-radius:16px;overflow:hidden;border:1px solid rgba(18,24,38,.12);
    display:flex;flex-direction:column;
  }
  .stadium-vid video{
    width:100%;aspect-ratio:16/9;object-fit:cover;background:#000;display:block;
  }
  .stadium-vid .body{padding:1rem 1.05rem 1.15rem;color:#fff;flex:1}
  .stadium-vid .tag{font-size:.62rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#f0d78c}
  .stadium-vid h3{font-family:var(--display);font-size:1.15rem;letter-spacing:.03em;margin:.35rem 0 .4rem}
  .stadium-vid p{font-size:.84rem;line-height:1.45;color:rgba(238,243,250,.72);margin:0}
  .stadium-vid .miss{
    aspect-ratio:16/9;display:grid;place-items:center;padding:1rem;text-align:center;
    background:linear-gradient(145deg,#163a74,#0b1220);color:rgba(255,255,255,.65);font-size:.82rem;
  }
  .arena-gallery{margin-top:1.25rem}
  .arena-gallery h3{font-family:var(--display);font-size:1.35rem;letter-spacing:.03em;margin-bottom:.65rem}
  .arena-gallery-grid{display:grid;gap:.65rem;grid-template-columns:1fr}
  @media(min-width:640px){.arena-gallery-grid{grid-template-columns:1fr 1fr}}
  @media(min-width:1000px){.arena-gallery-grid{grid-template-columns:repeat(3,1fr)}}
  .arena-gallery-item{
    border-radius:12px;overflow:hidden;background:#0b1220;border:1px solid rgba(18,24,38,.1);
  }
  .arena-gallery-item video{width:100%;aspect-ratio:16/9;object-fit:cover;background:#000;display:block}
  .arena-gallery-item span{display:block;padding:.45rem .65rem;font-size:.68rem;font-weight:700;color:#5c6473;letter-spacing:.04em}
</style>
</head>
<body class="tp-page">
<div class="ice-lines"></div>
<header class="site-header" id="site-header"></header>
<div id="teamRoot"></div>
<footer class="site-footer" id="site-footer"></footer>
<script src="assets/js/i18n.js?v=1"></script>
<script src="assets/js/site.js?v=80"></script>
<script src="assets/js/support-widget.js?v=15"></script>
<script src="assets/js/cart.js?v=11"></script>
<script src="assets/js/teams-data.js?v=9"></script>
<script src="assets/js/expansion-teams-data.js?v=1"></script>
<script src="assets/js/team-brand.js?v=6"></script>
<script src="assets/js/division-logos.js?v=1"></script>
<script src="assets/js/player-characters.js?v=1"></script>
<script src="assets/js/character-art.js?v=1"></script>
<script src="assets/js/team-vault.js?v=1"></script>
<script>
(async function () {
  let stadiumData = {};
  try {
    const res = await fetch("assets/js/stadium-videos.json?v=1");
    if (res.ok) stadiumData = await res.json();
  } catch (_) {}

  const params = new URLSearchParams(location.search);
  const slug = params.get("team");
  const team = slug ? window.PGBTeams.bySlug(slug) : null;
  if (!team) {
    document.getElementById("teamRoot").innerHTML = `
      <section class="team-section" style="padding:3rem 4vw;text-align:center">
        <h2>Team not found</h2>
        <p style="color:#5c6473;margin:1rem 0">No franchise matched <code>${slug || ""}</code>.</p>
        <a class="btn btn-platinum btn-sm" href="teams.html">Browse all teams</a>
        <a class="btn btn-ghost btn-sm" href="expansion.html#pools">Global Power pools</a>
      </section>`;
    document.title = "Team not found — PuckGold";
    return;
  }
  document.title = team.name + " — Team Vault | PuckGold";

  const vaultLink = (sectionId) =>
    `team-vault.html?team=${encodeURIComponent(team.slug)}&section=${encodeURIComponent(sectionId)}`;

  const vaultHref = (sectionId) => {
    const sec = window.PGBTeamVault?.section(sectionId);
    if (sec?.teamAnchor) return `team.html?team=${encodeURIComponent(team.slug)}#${sec.teamAnchor}`;
    return vaultLink(sectionId);
  };

  const vault = [
    { title: "Logos & marks", path: "01-Logos-Marks", desc: "Primary, secondary, mono, app icons." },
    { title: "Brand kit", path: "02-Brand-Kit", desc: "Guidelines, colorways, co-marketing." },
    { title: "3 stadiums", path: "03-Stadiums", desc: "stadium-01 · stadium-02 · stadium-03 + lore.md" },
    { title: "9 players", path: "04-Players", desc: "player-01…09 with bio.md, headshots/, clips/" },
    { title: "Jerseys & uniforms", path: "05-Jerseys-Uniforms", desc: "Home / away / alternate flats." },
    { title: "Posters", path: "06-Posters", desc: "Promo posters and arena art." },
    { title: "Swag kits", path: "07-Swag-Kits", desc: "Streetwear, hats, pins, retail kits." },
    { title: "Pucks & collectibles", path: "08-Pucks-Collectibles", desc: "Founders puck, badges, limited drops." },
  ];

  const mascot = window.PGBCharacters?.teamMeta(team.slug)?.mascot;
  const logoWrap = window.PGBDivisionLogos?.logoHtml(team.slug, team, 88) || "";
  const logoBlock = logoWrap
    ? `<div class="tp-card-logo" style="width:88px;height:88px;margin-bottom:.75rem">${logoWrap}</div>`
    : "";

  const root = document.getElementById("teamRoot");
  root.innerHTML = `
    <section class="team-hero">
      <div class="team-hero-bg" style="background:linear-gradient(120deg,${team.colorDeep} 0%, ${team.color} 45%, #0b1220 100%)"></div>
      <div class="team-hero-inner">
        ${logoBlock}
        <span class="kicker">${team.expansion ? `Global Power Division${team.pool ? " · Pool " + team.pool : ""}` : "Underdog Division · Founding Four"} · ${team.code}${mascot ? ` · Mascot: ${mascot.name}` : ""}</span>
        <h1>${team.name.toUpperCase()}</h1>
        <p class="motto">${team.tagline}</p>
        <div class="meta">
          <span>${team.arena}</span>
          <span>Season ${team.position || "—"}${team.points != null ? " · " + team.points + " PTS" : ""}</span>
          <span>${team.record || ""}</span>
        </div>
        <div class="cta-row" style="margin-top:1.2rem">
          <a href="shop.html#best" class="btn btn-og btn-sm">Shop ${team.code}</a>
          <a href="${vaultLink("02-Brand-Kit")}" class="btn btn-platinum btn-sm">Brand kit</a>
          <a href="#vault" class="btn btn-ghost btn-sm">Download assets →</a>
        </div>
      </div>
    </section>

    <nav class="team-tabs" aria-label="Team sections">
      <div class="team-tabs-inner">
        <a href="#vault" class="active">Vault</a>
        <a href="#stadiums">Stadiums · live</a>
        <a href="#roster">9 Players</a>
        <a href="#audio">Stadium sound</a>
        <a href="#shop">Merch + vibes</a>
      </div>
    </nav>

    <section class="team-section" id="vault">
      <h2>Logos, stadiums, roster art, jerseys, and swag — synced from the team vault.</h2>
      <p style="color:#5c6473;margin:-.4rem 0 1.1rem;max-width:40rem">Drop updated assets into the folders below. The site reads from <code>${team.folder}</code>.</p>
      <div class="vault-grid">
        ${vault
          .map(
            (v) => `
          <div class="vault-card">
            <div class="tag">Vault</div>
            <h3>${v.title}</h3>
            <p>${v.desc}</p>
            <a href="${vaultHref(v.path)}">Open vault →</a>
          </div>`
          )
          .join("")}
      </div>
      <div class="vault-grid cols-3" style="margin-top:.75rem">
        <div class="vault-card drop"><strong>Vault · Swag</strong><span>Drop coming soon</span></div>
        <div class="vault-card drop"><strong>Vault · Puck</strong><span>Drop coming soon</span></div>
        <div class="vault-card drop"><strong>Vault · Poster</strong><span>Drop coming soon</span></div>
      </div>
    </section>

    <section class="team-section" id="audio">
      <h2>Stadium sound</h2>
      <div class="audio-box">
        <div>
          <div class="tag" style="color:#f0d78c">Goal blast</div>
          <h3 style="font-family:var(--display);font-size:1.8rem;letter-spacing:.04em;margin:.35rem 0 .6rem">${team.name} goal call</h3>
          <p style="color:rgba(255,255,255,.75);margin-bottom:1rem">Chatterbox PA / booth drops live in the team vault — tap to blast. Swap in a real horn WAV anytime.</p>
          <button type="button" class="horn-btn" id="hornBtn">Play goal blast</button>
          <p id="hornNote" style="margin-top:.7rem;font-size:.78rem;color:rgba(255,255,255,.55)">Loading stadium audio…</p>
          <p style="margin-top:.85rem"><a href="listen.html?show=founding-four-arena-pack" style="color:#f0d78c;font-weight:800;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;text-decoration:underline;text-underline-offset:3px">All Founding Four arena packs ›</a></p>
        </div>
        <div>
          <div class="tag" style="color:#f0d78c">From the booth</div>
          <h3 style="margin:.35rem 0 .55rem">${team.name} · Booth</h3>
          <p style="color:rgba(255,255,255,.75);font-size:.9rem;margin-bottom:.8rem">${team.booth}</p>
          <div class="booth-list">
            <div class="booth-item"><b>Walkout intro</b><audio id="audWalkout" controls preload="metadata"></audio><div class="miss" id="missWalkout" hidden>Drop soon</div></div>
            <div class="booth-item"><b>Goal call</b><audio id="audGoal" controls preload="metadata"></audio><div class="miss" id="missGoal" hidden>Drop soon</div></div>
            <div class="booth-item"><b>Win outro</b><audio id="audWin" controls preload="metadata"></audio><div class="miss" id="missWin" hidden>Drop soon</div></div>
          </div>
        </div>
      </div>
    </section>

    <section class="team-section" id="stadiums">
      <h2>Stadiums · live arena video</h2>
      <p style="color:#5c6473;margin:-.3rem 0 1rem">Three home sheets per club — primary bowl, practice/terrace, and pop-up/outdoor. Extra angles in the gallery below.</p>
      <div class="stadium-vid-grid" id="stadiumVideos"></div>
      <div class="arena-gallery" id="arenaGallery" hidden>
        <h3>More arena angles</h3>
        <div class="arena-gallery-grid" id="arenaGalleryGrid"></div>
      </div>
    </section>

    <section class="team-section" id="roster">
      <h2>9 Digital Characters</h2>
      <p style="color:#5c6473;margin:-.3rem 0 1rem">Collectible mascot-class skaters with special powers — Space Jam / VeeFriends energy. Drop PNG headshots into <code>${team.folder}04-Players</code>.</p>
      <div class="roster-grid">
        ${team.players
          .map((p) => {
            const char = window.PGBCharacters?.forPlayer(p, team);
            const avatarSvg = window.PGBCharacterArt?.playerAvatarSvg(p, team, char, p.id) || "";
            return `
          <article class="roster-card">
            <div class="roster-viz" style="background:linear-gradient(160deg,${team.color},${team.colorDeep})">
              <span class="num">#${p.num}</span>
              <div class="avatar" data-player-slot="${p.slot}">${avatarSvg}</div>
              ${char?.powerDef ? `<span class="roster-power">${char.powerDef.icon} ${char.powerDef.name}</span>` : ""}
            </div>
            <div class="roster-body">
              <div class="pos">${p.slot} · ${p.pos} · ${p.role} · ${char?.teamMeta?.species || "Digital Skater"}</div>
              <h3>${char?.codename || p.name}</h3>
              <div class="roster-codename">${p.name}</div>
              <p style="font-size:.84rem;color:#5c6473;margin-top:.35rem;line-height:1.45">${char?.powerDef?.desc || p.bio}</p>
              <div class="roster-meta">
                <div><span>Rank</span><strong>${p.rank}</strong></div>
                <div><span>Pts</span><strong>${p.pts}</strong></div>
                ${char?.stats ? `<div><span>Speed</span><strong>${char.stats.speed}</strong></div>` : ""}
              </div>
              <a class="link" href="player.html?id=${p.id}">Character card ›</a>
            </div>
          </article>`;
          })
          .join("")}
      </div>
    </section>

    <section class="shop-strip" id="shop">
      <div>
        <h3>MERCH + VIBES</h3>
        <p style="color:#5c6473;margin-top:.25rem">Jerseys, streetwear, swag kits, playlists. Folders: <code>07-Swag-Kits</code>, <code>10-Vibe-Playlists</code>, league <code>assets/vault/shopping</code>.</p>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:.45rem">
        <a class="tp-btn" href="shop.html#best">Team store</a>
        <a class="tp-btn ghost" href="${vaultLink("02-Brand-Kit")}">Team brand kit</a>
        <a class="tp-btn ghost" href="${vaultLink("08-Pucks-Collectibles")}">Founders puck</a>
      </div>
    </section>

    <div class="map-note">
      <strong style="color:#0b1220">Vault mapping</strong> —
      Source vault: <code>${team.folder}</code> (drag/drop friendly).
      League shopping/swag/games/content: <code>assets/vault/</code>.
      Legacy alias folders (<code>mighty-geckz</code>, etc.) still exist — migrate into these numbered folders.
    </div>
  `;

  const base = team.folder + "09-Audio/";
  const clips = {
    horn: [base + "goal-horn/main.wav", base + "goal-horn/main.mp3", base + "goal-call/main.wav"],
    walkout: [base + "walkout-intro/main.wav", base + "walkout-intro/main.mp3"],
    goal: [base + "goal-call/main.wav", base + "goal-call/main.mp3"],
    win: [base + "win-outro/main.wav", base + "win-outro/main.mp3"],
  };

  function bindAudio(el, missEl, candidates) {
    if (!el) return;
    let i = 0;
    const tryNext = () => {
      if (i >= candidates.length) {
        el.removeAttribute("src");
        el.style.display = "none";
        if (missEl) {
          missEl.hidden = false;
          missEl.textContent = "Drop WAV into team 09-Audio folder";
        }
        return;
      }
      el.src = candidates[i++];
    };
    el.addEventListener("error", tryNext);
    tryNext();
  }

  bindAudio(document.getElementById("audWalkout"), document.getElementById("missWalkout"), clips.walkout);
  bindAudio(document.getElementById("audGoal"), document.getElementById("missGoal"), clips.goal);
  bindAudio(document.getElementById("audWin"), document.getElementById("missWin"), clips.win);

  const hornBtn = document.getElementById("hornBtn");
  const hornNote = document.getElementById("hornNote");
  let hornIdx = 0;
  let audio;
  async function playHorn() {
    const src = clips.horn[hornIdx];
    if (!src) {
      if (hornNote) hornNote.textContent = "Drop main.wav into 09-Audio/goal-horn/ or goal-call/";
      return;
    }
    try {
      audio = new Audio(src);
      audio.currentTime = 0;
      await audio.play();
      if (hornNote) hornNote.textContent = "Goal blast live";
    } catch (_) {
      hornIdx += 1;
      playHorn();
    }
  }
  hornBtn?.addEventListener("click", () => {
    hornIdx = 0;
    playHorn();
  });
  if (hornNote) hornNote.textContent = "Tap for PA goal blast · real horn WAV optional";

  const pack = stadiumData[team.slug] || { stadiums: {}, gallery: [] };
  const vidRoot = document.getElementById("stadiumVideos");
  if (vidRoot) {
    vidRoot.innerHTML = team.stadiums
      .map((s) => {
        const src = pack.stadiums[s.id] || `${team.folder}03-Stadiums/${s.id}/film.mp4`;
        return `
        <article class="stadium-vid">
          <video controls playsinline preload="metadata" poster="" src="${src}"></video>
          <div class="body">
            <div class="tag">${s.id} · live</div>
            <h3>${s.name}</h3>
            <p>${s.lore}</p>
          </div>
        </article>`;
      })
      .join("");
  }

  const gal = pack.gallery || [];
  const galWrap = document.getElementById("arenaGallery");
  const galGrid = document.getElementById("arenaGalleryGrid");
  if (galWrap && galGrid && gal.length) {
    galWrap.hidden = false;
    galGrid.innerHTML = gal
      .map((src) => {
        const label = src.split("/").pop().replace(/\.mp4$/i, "").replace(/-/g, " ");
        return `
        <div class="arena-gallery-item">
          <video controls playsinline preload="metadata" src="${src}"></video>
          <span>${label}</span>
        </div>`;
      })
      .join("");
  }
  window.PGBDivisionLogos?.hydrate(root);
})();
</script>
</body>
</html>
