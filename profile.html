<link rel="stylesheet" href="assets/css/site.css?v=58">

<style>
  .pf{max-width:560px;margin:0 auto;padding:0 0 4rem}
  .pf-hero{
    position:relative;color:#fff;padding:2rem 1.25rem 1.35rem;text-align:center;
    background:
      radial-gradient(circle at 70% 0%, rgba(240,215,140,.3), transparent 42%),
      linear-gradient(165deg,#0a162c 0%,#163a74 55%,#7a1524 120%);
  }
  .pf-av{
    width:96px;height:96px;border-radius:50%;margin:0 auto .65rem;
    display:grid;place-items:center;font-size:3rem;
    background:linear-gradient(145deg,#f0d78c,#d4af37);
    border:3px solid rgba(255,255,255,.4);
  }
  .pf-av.gold-frame{box-shadow:0 0 0 4px #f0d78c,0 0 28px rgba(212,175,55,.5)}
  .pf-hero h1{font-family:var(--display);font-size:clamp(1.9rem,6vw,2.5rem);margin:0;letter-spacing:.04em}
  .pf-hero .handle{color:#f0d78c;font-weight:800;font-size:.95rem}
  .pf-sign{display:inline-block;margin-top:.35rem;font-size:.82rem;font-weight:700;opacity:.9}
  .pf-hero .bio{margin:.65rem auto 0;max-width:28rem;color:rgba(255,255,255,.82);font-size:.9rem;line-height:1.45}
  .pf-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.35rem;margin-top:1.1rem}
  .pf-stats div{background:rgba(0,0,0,.28);border-radius:12px;padding:.55rem .25rem}
  .pf-stats strong{display:block;font-family:var(--display);font-size:1.25rem}
  .pf-stats span{font-size:.58rem;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.55)}
  .pf-mult{
    display:inline-flex;align-items:center;gap:.35rem;margin-top:.85rem;
    padding:.35rem .7rem;border-radius:999px;font-size:.68rem;font-weight:900;
    letter-spacing:.1em;text-transform:uppercase;
    background:#f0d78c;color:#10203a;
  }
  .pf-mult.free{background:rgba(255,255,255,.12);color:#f0d78c}
  .pf-actions{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;margin-top:1rem}
  .pf-body{padding:1rem 1.15rem}
  .pf-tabs{display:flex;gap:.2rem;border-bottom:1px solid rgba(18,24,38,.08);margin-bottom:.85rem}
  .pf-tabs button{
    flex:1;border:0;background:transparent;padding:.75rem .4rem;font-weight:800;
    font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:#8a93a3;cursor:pointer;
    border-bottom:2px solid transparent;
  }
  .pf-tabs button.is-active{color:#121826;border-color:#163a74}
  .pf-panel{display:none}
  .pf-panel.on{display:block}
  .feed-post{
    background:#fff;border:1px solid rgba(18,24,38,.08);border-radius:16px;
    padding:1rem;margin-bottom:.65rem;
  }
  .feed-post .who{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem}
  .feed-post .who .mini{
    width:36px;height:36px;border-radius:50%;display:grid;place-items:center;
    background:#eef1f6;font-size:1.15rem;
  }
  .feed-post p{margin:0;font-size:.95rem;line-height:1.45}
  .feed-bar{display:flex;gap:.75rem;margin-top:.75rem;align-items:center}
  .feed-bar button{
    border:0;background:#f4f6fa;border-radius:999px;padding:.4rem .75rem;
    font-weight:800;font-size:.78rem;cursor:pointer;color:#163a74;
  }
  .feed-bar button.liked{background:#ffe4ec;color:#be123c}
  .cmt{
    display:grid;grid-template-columns:auto 1fr;gap:.55rem;
    border-bottom:1px solid rgba(18,24,38,.06);padding:.75rem 0;
  }
  .cmt .mini{
    width:36px;height:36px;border-radius:50%;display:grid;place-items:center;
    background:#eef1f6;font-size:1.1rem;
  }
  .cmt strong{font-size:.85rem}
  .cmt p{margin:.2rem 0;font-size:.9rem;line-height:1.4}
  .vote{
    display:inline-flex;align-items:center;gap:.15rem;margin-top:.35rem;
  }
  .vote button{
    border:0;background:#f4f6fa;width:32px;height:32px;border-radius:8px;
    font-weight:900;cursor:pointer;color:#163a74;
  }
  .vote button.on-up{background:#dcfce7;color:#15803d}
  .vote button.on-down{background:#fee2e2;color:#b91c1c}
  .vote .score{min-width:1.5rem;text-align:center;font-weight:800;font-size:.85rem}
  .toast{
    position:fixed;left:50%;bottom:1.5rem;transform:translateX(-50%) translateY(120%);
    background:#10203a;color:#f0d78c;padding:.65rem 1.1rem;border-radius:999px;
    font-weight:800;font-size:.8rem;letter-spacing:.04em;z-index:80;
    transition:transform .25s ease;pointer-events:none;white-space:nowrap;
  }
  .toast.show{transform:translateX(-50%) translateY(0)}
  .edit-grid{display:grid;gap:.55rem}
  .edit-grid label{font-size:.65rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#5c6473}
  .edit-grid input,.edit-grid textarea{width:100%;padding:.65rem .75rem;border-radius:10px;border:1px solid rgba(18,24,38,.12);font:inherit}
  .share-box{font-family:ui-monospace,Menlo,monospace;font-size:.72rem;background:#0b1220;color:#f0d78c;padding:.75rem;border-radius:10px;word-break:break-all}
  .link-row{
    display:flex;align-items:center;gap:.55rem;padding:.65rem .7rem;border-radius:10px;
    background:#f4f6fa;margin-bottom:.4rem;font-size:.85rem;
  }
  .link-row a{flex:1;font-weight:700;color:#163a74;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .board-row{
    display:flex;align-items:center;gap:.65rem;padding:.65rem 0;
    border-bottom:1px solid rgba(18,24,38,.06);font-size:.9rem;
  }
  .board-row.you{background:rgba(22,58,116,.06);margin:0 -.5rem;padding:.65rem .5rem;border-radius:10px}
  .board-row .rk{font-family:var(--display);width:1.75rem;color:#163a74}
  .board-row .av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#eef1f6}
  .gate{
    margin:2rem 1.15rem;padding:1.5rem;border-radius:16px;text-align:center;
    background:linear-gradient(145deg,#10203a,#163a74);color:#fff;
  }
  .pf-farm{
    margin:0 1.15rem 1rem;padding:1rem .95rem;border-radius:16px;
    background:linear-gradient(145deg,#0b1220,#163a74);color:#fff;
  }
  .pf-farm .lbl{font-size:.58rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#f0d78c}
  .pf-farm .row{display:flex;justify-content:space-between;align-items:baseline;gap:.75rem;margin:.35rem 0 .75rem}
  .pf-farm .pts{font-family:var(--display);font-size:1.6rem;letter-spacing:.03em}
  .pf-farm .sub{font-size:.75rem;color:rgba(238,243,250,.65)}
  .pf-quests{display:grid;gap:.4rem}
  .pf-quests a{
    display:flex;align-items:center;gap:.55rem;padding:.55rem .65rem;border-radius:10px;
    text-decoration:none;color:#fff;background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.1);font-size:.82rem;font-weight:700;
  }
  .pf-quests a.done{border-color:rgba(240,215,140,.4);background:rgba(240,215,140,.12)}
  .pf-quests .mark{
    width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;
    font-size:.65rem;font-weight:900;background:rgba(255,255,255,.12);color:rgba(255,255,255,.55);
  }
  .pf-quests a.done .mark{background:#f0d78c;color:#0b1220}
  .pf-quests .go{margin-left:auto;font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:#f0d78c}
</style>
</head>

<script>
(function () {
  const PF = window.PGBProfile;
  const A = window.PGBAuth;
  const params = new URLSearchParams(location.search);
  const ref = params.get("ref");
  if (ref) {
    try {
      localStorage.setItem("pgb-aff-ref", ref);
      localStorage.setItem("pgb-aff-ref-at", String(Date.now()));
    } catch (_) {}
  }

  let viewing = params.get("u") || "";
  const signed = A.isSignedIn() && A.isOnboarded();

  if (!signed && !viewing) {
    document.getElementById("pfRoot").innerHTML = `
      <div class="gate">
        <div style="font-size:2.5rem;margin-bottom:.5rem">🏒</div>
        <h2 style="font-family:var(--display);letter-spacing:.04em;margin:0 0 .5rem">CREATE YOUR VIBE</h2>
        <p style="color:rgba(255,255,255,.75);margin:0 0 1rem;font-size:.9rem">Snapchat-style emoji · zodiac · wild name. Then farm likes, votes &amp; comments.</p>
        <a class="btn btn-founding btn-block" href="signin.html?next=profile.html">Start onboarding</a>
        <a class="btn btn-ghost btn-block" href="profile.html?u=goldrushgus" style="margin-top:.45rem;border-color:rgba(255,255,255,.25);color:#fff">Peek a demo profile</a>
      </div>`;
    return;
  }

  if (signed) PF.ensureHandle();
  const mine = signed ? PF.myProfile() : { handle: "" };
  if (!viewing && mine.handle) viewing = mine.handle;
  let isSelf = signed && PF.slugify(viewing) === mine.handle;
  let tab = "feed";

  function playPts() {
    try {
      const p = JSON.parse(localStorage.getItem("pgb-play") || "{}");
      return p.points || p.xp || 0;
    } catch (_) {
      return 0;
    }
  }

  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.classList.remove("show"), 1600);
  }

  function ptsMsg(r) {
    if (!r || !r.awarded) return;
    const m = r.mult > 1 ? ` (${r.base}×${r.mult})` : "";
    toast(`+${r.awarded} XP${m}`);
  }

  function render() {
    const profile = PF.getByHandle(viewing) || (isSelf ? mine : null);
    if (!profile) {
      document.getElementById("pfRoot").innerHTML = `
        <div class="gate">
          <h2 style="font-family:var(--display)">Profile not found</h2>
          <a class="btn btn-founding btn-sm" href="signin.html">Create mine</a>
        </div>`;
      return;
    }
    isSelf = signed && PF.slugify(viewing) === (PF.myProfile().handle || "");
    document.title = `@${profile.handle} — PuckGold`;
    const pts = isSelf ? playPts() : 0;
    const tiers = PF.unlockTiers(pts);
    const goldFrame = tiers.find((t) => t.id === "frame")?.unlocked;
    const share = PF.shareUrl(profile.handle);
    const cmts = PF.comments(profile.handle);
    const posts = PF.feed(profile.handle);
    const subbed = signed ? PF.isSubscribed(profile.handle) : false;
    const mem = A.membership();
    const board = PF.leaderboardSlice().slice(0, 8);

    document.getElementById("pfRoot").innerHTML = `
      <div class="pf-hero">
        <div class="pf-av ${goldFrame ? "gold-frame" : ""}">${profile.avatar || "🏒"}</div>
        <h1>${profile.displayName || "Fan"}</h1>
        <div class="handle">@${profile.handle}</div>
        ${profile.signEmoji ? `<div class="pf-sign">${profile.signEmoji} ${profile.signLabel || ""}</div>` : ""}
        <p class="bio">${profile.bio || ""}</p>
        <div class="pf-stats">
          <div><strong>${isSelf ? pts.toLocaleString() : (profile.likes || 0)}</strong><span>${isSelf ? "XP" : "Likes"}</span></div>
          <div><strong>${profile.subscribers || 0}</strong><span>Subs</span></div>
          <div><strong>${profile.likes || 0}</strong><span>♡</span></div>
          <div><strong>${(profile.links || []).filter((l) => l.verified).length}</strong><span>Verified</span></div>
        </div>
        ${
          isSelf
            ? `<div class="pf-mult ${mem.multiplier >= 5 ? "" : "free"}">${mem.multiplier >= 5 ? "5× OG PASS ACTIVE" : "1× FAN · unlock 5× with $36 OG"}</div>`
            : ""
        }
        <div class="pf-actions">
          <button type="button" class="btn btn-founding btn-sm" id="btnShare">Share</button>
          ${
            isSelf
              ? `<a href="fantasy.html#quests" class="btn btn-sapphire btn-sm">Quests</a>
                 <a href="checkout.html?offer=og" class="btn btn-ghost btn-sm" data-claim-og style="border-color:rgba(255,255,255,.3);color:#fff">${mem.multiplier >= 5 ? "OG locked ✓" : "Get 5× · $36"}</a>
                 <button type="button" class="btn btn-ghost btn-sm" id="btnSignOut" style="border-color:rgba(255,255,255,.3);color:#fff">Sign out</button>`
              : signed
                ? `<button type="button" class="btn btn-sapphire btn-sm" id="btnSub">${subbed ? "Following" : "Follow"}</button>
                   <button type="button" class="btn btn-ghost btn-sm" id="btnTip" style="border-color:rgba(255,255,255,.3);color:#fff">Tip 50</button>`
                : `<a href="signin.html" class="btn btn-sapphire btn-sm">Join to follow</a>`
          }
        </div>
      </div>

      ${isSelf ? `<div class="pf-farm" id="pfFarm"></div>` : ""}

      <div class="pf-body">
        <div class="pf-tabs">
          <button type="button" data-tab="feed" class="${tab === "feed" ? "is-active" : ""}">Feed</button>
          <button type="button" data-tab="comments" class="${tab === "comments" ? "is-active" : ""}">Chat</button>
          <button type="button" data-tab="board" class="${tab === "board" ? "is-active" : ""}">Board</button>
          <button type="button" data-tab="more" class="${tab === "more" ? "is-active" : ""}">More</button>
        </div>

        <div class="pf-panel ${tab === "feed" ? "on" : ""}" data-panel="feed">
          ${
            isSelf
              ? `<form id="feedForm" style="display:flex;gap:.4rem;margin-bottom:.85rem">
                  <input id="feedText" placeholder="Drop a vibe…" maxlength="220" style="flex:1;padding:.7rem .9rem;border-radius:999px;border:1px solid rgba(18,24,38,.12);font:inherit">
                  <button class="btn btn-sapphire btn-sm" type="submit">Post</button>
                </form>`
              : ""
          }
          <div id="feedList"></div>
        </div>

        <div class="pf-panel ${tab === "comments" ? "on" : ""}" data-panel="comments">
          <form id="cmtForm" style="display:flex;gap:.4rem;margin-bottom:.75rem">
            <input id="cmtText" placeholder="Comment…" maxlength="280" style="flex:1;padding:.7rem .9rem;border-radius:999px;border:1px solid rgba(18,24,38,.12);font:inherit" ${signed ? "" : "disabled"}>
            <button class="btn btn-sapphire btn-sm" type="submit" ${signed ? "" : "disabled"}>Post</button>
          </form>
          <div id="cmtList"></div>
        </div>

        <div class="pf-panel ${tab === "board" ? "on" : ""}" data-panel="board">
          <p style="font-size:.85rem;color:#5c6473;margin:0 0 .75rem">Live farm board · OG Pass members earn <strong>5×</strong> on every action.</p>
          <div id="boardList"></div>
          <a href="fantasy.html#prizes" class="btn btn-founding btn-sm btn-block" style="margin-top:1rem">See giveaways &amp; prizes</a>
        </div>

        <div class="pf-panel ${tab === "more" ? "on" : ""}" data-panel="more">
          <div style="margin-bottom:1rem">
            <h3 style="font-size:.9rem;margin:0 0 .5rem">Share link</h3>
            <div class="share-box">${share}</div>
          </div>
          <div style="margin-bottom:1rem">
            <h3 style="font-size:.9rem;margin:0 0 .5rem">Links · verify to farm</h3>
            <div id="linkList"></div>
            ${
              isSelf
                ? `<div style="display:grid;gap:.4rem;margin-top:.65rem">
                    <select id="platSel">${PF.PLATFORMS.map((p) => `<option value="${p.id}">${p.label} (+${p.pts})</option>`).join("")}</select>
                    <input id="platUrl" placeholder="https://…">
                    <button type="button" class="btn btn-platinum btn-sm" id="btnSaveLink">Save link</button>
                    <button type="button" class="btn btn-founding btn-sm" id="btnVerify">Verify · farm XP</button>
                  </div>`
                : ""
            }
          </div>
          ${
            isSelf
              ? `<div class="edit-grid">
                  <h3 style="font-size:.9rem;margin:0">Edit vibe</h3>
                  <div><label>Display name</label><input id="edName" value="${profile.displayName || ""}"></div>
                  <div><label>Handle</label><input id="edHandle" value="${profile.handle || ""}"></div>
                  <div><label>Bio</label><textarea id="edBio" rows="3">${profile.bio || ""}</textarea></div>
                  <div><label>Avatar emoji</label><input id="edAv" value="${profile.avatar || "🏒"}" maxlength="4"></div>
                  <button type="button" class="btn btn-founding btn-sm" id="btnSaveProf">Save</button>
                  <button type="button" class="btn btn-ghost btn-sm" id="btnRedo">Re-roll onboarding</button>
                </div>
                <div style="margin-top:1rem">
                  <h3 style="font-size:.9rem;margin:0 0 .5rem">Unlocks</h3>
                  <div style="display:flex;flex-wrap:wrap;gap:.35rem">
                    ${tiers.map((t) => `<span style="font-size:.68rem;font-weight:800;padding:.35rem .55rem;border-radius:8px;background:${t.unlocked ? "#e8f5e9" : "#f4f6fa"};color:${t.unlocked ? "#15803d" : "#5c6473"}">${t.unlocked ? "✓" : "🔒"} ${t.label}</span>`).join("")}
                  </div>
                </div>`
              : ""
          }
        </div>
      </div>
    `;

    // Feed
    document.getElementById("feedList").innerHTML = posts.length
      ? posts
          .map((p) => {
            const liked = PF.isFeedLiked(p.id);
            return `<article class="feed-post">
              <div class="who"><div class="mini">${p.avatar || profile.avatar}</div>
                <div><strong>${p.name || profile.displayName}</strong><div style="font-size:.72rem;color:#5c6473">${new Date(p.at).toLocaleString()}</div></div>
              </div>
              <p>${p.text}</p>
              <div class="feed-bar">
                <button type="button" class="${liked ? "liked" : ""}" data-flike="${p.id}">${liked ? "♥" : "♡"} ${p.likes || 0}</button>
              </div>
            </article>`;
          })
          .join("")
      : `<p style="color:#5c6473;font-size:.9rem">${isSelf ? "Post your first vibe — farms XP." : "No posts yet."}</p>`;

    // Comments
    document.getElementById("cmtList").innerHTML = cmts.length
      ? cmts
          .map((c) => {
            const vs = PF.voteState(c.id);
            const liked = PF.isLiked(c.id);
            const score = (c.ups || 0) - (c.downs || 0);
            return `<div class="cmt">
              <div class="mini">${c.fromAvatar || "🏒"}</div>
              <div>
                <strong>${c.from}${c.fromHandle ? " · @" + c.fromHandle : ""}</strong>
                <p>${c.text}</p>
                <div class="vote">
                  <button type="button" class="${vs === "up" ? "on-up" : ""}" data-up="${c.id}" aria-label="Upvote">▲</button>
                  <span class="score">${score}</span>
                  <button type="button" class="${vs === "down" ? "on-down" : ""}" data-down="${c.id}" aria-label="Downvote">▼</button>
                  <button type="button" data-like="${c.id}" style="margin-left:.35rem;border:0;background:${liked ? "#ffe4ec" : "#f4f6fa"};border-radius:8px;padding:.35rem .55rem;font-weight:800;cursor:pointer;color:${liked ? "#be123c" : "#163a74"}">${liked ? "♥" : "♡"} ${c.likes || 0}</button>
                </div>
              </div>
            </div>`;
          })
          .join("")
      : `<p style="color:#5c6473;font-size:.9rem">No comments — drop the first take.</p>`;

    // Board
    document.getElementById("boardList").innerHTML = board
      .map(
        (r) => `<a class="board-row ${r.you ? "you" : ""}" href="profile.html?u=${encodeURIComponent(r.handle)}">
          <span class="rk">#${r.rank}</span>
          <span class="av">${r.avatar || "🏒"}</span>
          <span style="flex:1;font-weight:700">${r.name}${r.premium ? " · 5×" : ""}</span>
          <strong>${Math.round(r.pts).toLocaleString()}</strong>
        </a>`
      )
      .join("");

    // Links
    const links = profile.links || [];
    const linkList = document.getElementById("linkList");
    if (linkList) {
      linkList.innerHTML = links.length
        ? links
            .map((l) => {
              const meta = PF.PLATFORMS.find((p) => p.id === l.platform);
              return `<div class="link-row"><strong style="min-width:72px">${meta?.label || l.platform}</strong><a href="${l.url}" target="_blank" rel="noopener">${l.url}</a>${l.verified ? '<span style="color:#15803d;font-size:.7rem;font-weight:800">✓</span>' : ""}</div>`;
            })
            .join("")
        : `<p style="color:#5c6473;font-size:.85rem">No links yet.</p>`;
    }

    paintFarm(pts, mem);
    bind();
  }

  function dayKey() {
    return new Date().toISOString().slice(0, 10);
  }
  function questDone() {
    const day = dayKey();
    let listen = false;
    try {
      const store = JSON.parse(localStorage.getItem("pgb-listen-xp") || "{}");
      listen = Object.keys(store).some((k) => k.endsWith(":" + day) || k.includes(":" + day));
    } catch (_) {}
    return {
      aura: localStorage.getItem("pgb-aura-day") === day,
      crest: localStorage.getItem("pgb-conductor-vote-day") === day,
      clip: !!localStorage.getItem("pgb-clip-crown-xp:" + day),
      listen,
    };
  }
  function paintFarm(pts, mem) {
    const el = document.getElementById("pfFarm");
    const sticky = document.getElementById("pfSticky");
    if (sticky) sticky.hidden = !isSelf;
    if (!el || !isSelf) return;
    const q = questDone();
    const doneN = [q.aura, q.crest, q.clip, q.listen].filter(Boolean).length;
    const last = (() => {
      try {
        return JSON.parse(localStorage.getItem("pgb-play") || "{}").lastSocial || null;
      } catch (_) {
        return null;
      }
    })();
    const lastLine = last?.pts
      ? `Last +${last.pts} · ${last.reason || "farm"}`
      : "Finish a quest to stack XP";
    const items = [
      { ok: q.aura, href: "aura-vote.html", label: "Aura Vote", tip: "+6 / window" },
      { ok: q.crest, href: "conductor-crest.html", label: "Conductor’s Crest", tip: "+15 / day" },
      { ok: q.clip, href: "clip-crown.html", label: "Clip Crown", tip: "submit XP" },
      { ok: q.listen, href: "listen.html", label: "Listen track", tip: "+8 / track" },
    ];
    el.innerHTML = `
      <div class="lbl">Today’s farm · ${doneN}/4</div>
      <div class="row">
        <div class="pts">${pts.toLocaleString()} XP</div>
        <div class="sub">${mem.multiplier}× · ${lastLine}</div>
      </div>
      <div class="pf-quests">
        ${items
          .map(
            (i) => `<a href="${i.href}" class="${i.ok ? "done" : ""}">
              <span class="mark">${i.ok ? "✓" : ""}</span>
              <span>${i.label}<br><span style="font-size:.68rem;font-weight:600;color:rgba(238,243,250,.55)">${i.tip}</span></span>
              <span class="go">${i.ok ? "Done" : "Go"}</span>
            </a>`
          )
          .join("")}
      </div>
      ${
        mem.multiplier < 5
          ? `<p style="margin:.75rem 0 0;font-size:.78rem"><a href="checkout.html?offer=og" data-claim-og style="color:#f0d78c;font-weight:800">Unlock 5× · $36 OG →</a></p>`
          : `<p style="margin:.75rem 0 0;font-size:.78rem;color:rgba(240,215,140,.9)">OG active — farm hard before the horn.</p>`
      }`;
    const line = document.getElementById("pfStickyLine");
    if (line) line.textContent = `${doneN}/4 quests · ${pts.toLocaleString()} XP`;
    el.querySelectorAll("[data-claim-og]").forEach((a) => {
      a.addEventListener("click", (e) => {
        e.preventDefault();
        window.PGBCart?.addOgOffer({ open: false });
        location.href = "checkout.html?offer=og";
      });
    });
  }

  function bind() {
    document.querySelectorAll(".pf-tabs button").forEach((b) => {
      b.addEventListener("click", () => {
        tab = b.dataset.tab;
        render();
      });
    });

    document.getElementById("btnShare")?.addEventListener("click", async () => {
      const share = PF.shareUrl(viewing);
      const me = viewing || {};
      const pts = (JSON.parse(localStorage.getItem("pgb-play") || "{}").points || 0);
      const mult = window.PGBAuth?.multiplier?.() || 1;
      const card = [
        `PUCKGOLD · FAN FARM`,
        `${me.avatar || "🏒"} @${me.handle || "fan"}`,
        me.displayName || "Fan",
        `${pts} XP · ${mult}×`,
        `Aura · Crest · Clip Crown`,
        share,
      ].join("\n");
      try {
        if (navigator.share) {
          await navigator.share({ title: "PuckGold farm", text: card, url: share });
        } else {
          await navigator.clipboard.writeText(card);
          toast("Farm card copied");
        }
        if (isSelf) ptsMsg(PF.addXp(8, "share-profile"));
      } catch (_) {
        try {
          await navigator.clipboard.writeText(share);
          toast("Link copied");
          if (isSelf) ptsMsg(PF.addXp(5, "share-profile"));
        } catch (__) {}
      }
    });

    document.getElementById("btnSignOut")?.addEventListener("click", () => {
      A.signOut();
      location.href = "signin.html";
    });

    document.getElementById("btnSub")?.addEventListener("click", () => {
      const r = PF.subscribe(viewing);
      ptsMsg(r.points);
      render();
    });
    document.getElementById("btnTip")?.addEventListener("click", () => {
      const r = PF.tip(viewing, 50);
      if (!r.ok) {
        location.href = "gems.html";
        return;
      }
      ptsMsg(r.points);
      render();
    });

    document.getElementById("feedForm")?.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = document.getElementById("feedText").value.trim();
      if (!text) return;
      const r = PF.addFeedPost(text);
      ptsMsg(r.points);
      document.getElementById("feedText").value = "";
      tab = "feed";
      render();
    });

    document.getElementById("feedList")?.addEventListener("click", (e) => {
      const b = e.target.closest("[data-flike]");
      if (!b) return;
      if (!signed) {
        location.href = "signin.html?next=" + encodeURIComponent(location.pathname + location.search);
        return;
      }
      const r = PF.likeFeed(b.dataset.flike, viewing);
      ptsMsg(r.points);
      render();
    });

    document.getElementById("cmtForm")?.addEventListener("submit", (e) => {
      e.preventDefault();
      if (!signed) {
        location.href = "signin.html";
        return;
      }
      const text = document.getElementById("cmtText").value.trim();
      if (!text) return;
      const r = PF.addComment(viewing, text);
      ptsMsg(r.points);
      document.getElementById("cmtText").value = "";
      render();
    });

    document.getElementById("cmtList")?.addEventListener("click", (e) => {
      if (!signed) {
        location.href = "signin.html";
        return;
      }
      const up = e.target.closest("[data-up]");
      const down = e.target.closest("[data-down]");
      const like = e.target.closest("[data-like]");
      if (up) ptsMsg(PF.upvote(up.dataset.up, viewing).points);
      if (down) ptsMsg(PF.downvote(down.dataset.down, viewing).points);
      if (like) ptsMsg(PF.likeComment(like.dataset.like, viewing).points);
      if (up || down || like) render();
    });

    document.getElementById("btnSaveLink")?.addEventListener("click", () => {
      PF.setLink(document.getElementById("platSel").value, document.getElementById("platUrl").value);
      render();
    });
    document.getElementById("btnVerify")?.addEventListener("click", () => {
      const plat = document.getElementById("platSel").value;
      const url = document.getElementById("platUrl").value;
      if (url) PF.setLink(plat, url);
      const r = PF.verifyLink(plat);
      if (r.pts) toast(`Verified · +${r.pts} XP`);
      else toast("Already verified");
      render();
    });

    document.getElementById("btnSaveProf")?.addEventListener("click", () => {
      PF.saveMyProfile({
        displayName: document.getElementById("edName").value,
        handle: document.getElementById("edHandle").value,
        bio: document.getElementById("edBio").value,
        avatar: document.getElementById("edAv").value || "🏒",
      });
      viewing = PF.myProfile().handle;
      history.replaceState(null, "", `profile.html?u=${encodeURIComponent(viewing)}`);
      toast("Saved");
      render();
    });
    document.getElementById("btnRedo")?.addEventListener("click", () => {
      location.href = "signin.html?redo=1";
    });
  }

  render();
})();
</script>
</body>
</html>
