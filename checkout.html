<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — PuckGold</title>
<script>(function(){try{var t=localStorage.getItem("pgb-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);else if(window.matchMedia("(prefers-color-scheme: light)").matches)document.documentElement.setAttribute("data-theme","light");}catch(e){}})();</script>
<link rel="stylesheet" href="assets/css/site.css?v=13">
<link rel="icon" href="assets/brand/favicon/favicon.ico?v=3" type="image/x-icon">
<style>
  .check-wrap{max-width:960px;margin:0 auto;padding:2.5rem 4vw 4rem}
  .check-wrap h1{font-family:var(--display);font-size:clamp(2.4rem,8vw,3.6rem);letter-spacing:.04em}
  .check-grid{display:grid;gap:1.25rem;margin-top:1.5rem}
  @media(min-width:800px){.check-grid{grid-template-columns:1.1fr .9fr}}
  .check-panel{
    background:linear-gradient(160deg, rgba(91,159,255,.12), transparent 40%), var(--panel);
    border:1px solid rgba(240,215,140,.22);border-radius:16px;padding:1.3rem;
  }
  .check-panel h2{font-family:var(--display);font-size:1.5rem;letter-spacing:.06em;margin-bottom:1rem}
  .check-line{display:flex;justify-content:space-between;gap:1rem;padding:.55rem 0;border-bottom:1px solid var(--line-soft);font-size:.92rem}
  .check-line strong{white-space:nowrap}
  .check-total{display:flex;justify-content:space-between;margin-top:1rem;font-weight:900;font-size:1.1rem;color:#f0d78c}
  .check-empty{color:var(--muted);padding:1rem 0}
</style>
</head>
<body>
<div class="ice-lines"></div>
<header class="site-header" id="site-header"></header>

<div class="check-wrap">
  <span class="kicker">Secure checkout</span>
  <h1>CHECK OUT</h1>
  <p style="color:var(--muted);margin-top:.5rem;max-width:36rem">Review your bag, adjust quantities, then lock in — founding member energy optional at checkout.</p>

  <div class="check-grid">
    <div class="check-panel">
      <h2>YOUR BAG</h2>
      <div id="checkItems"></div>
      <div class="check-total"><span>Subtotal</span><span id="checkSub">$0.00</span></div>
    </div>
    <div class="check-panel">
      <h2>PAY &amp; SHIP</h2>
      <form class="form" id="checkForm">
        <div class="field"><label>Email</label><input type="email" required placeholder="you@email.com"></div>
        <div class="field"><label>Name</label><input type="text" required placeholder="Founding member name"></div>
        <div class="field"><label>Ship to / gift note</label><textarea rows="3" placeholder="Address or digital gift message"></textarea></div>
        <button type="submit" class="btn btn-signin btn-block" style="margin-top:.8rem">Place order</button>
        <a href="shop.html" class="btn btn-ghost btn-block" style="margin-top:.5rem">Keep shopping</a>
        <a href="join.html" class="btn btn-og btn-block" style="margin-top:.5rem">Add $36 OG Gold Puck</a>
      </form>
      <p id="checkDone" hidden style="margin-top:1rem;color:#7eb6ff;font-weight:700">Order locked in demo mode — bag cleared. Welcome to the era.</p>
    </div>
  </div>
</div>

<footer class="site-footer" id="site-footer"></footer>
<script src="assets/js/i18n.js?v=1"></script>
<script src="assets/js/site.js?v=26"></script>
<script src="assets/js/support-widget.js?v=1"></script>
<script src="assets/js/cart.js?v=6"></script>
<script>
(function () {
  function money(n) { return "$" + Number(n).toFixed(2); }
  function render() {
    const items = window.PGBCart ? window.PGBCart.read() : [];
    const root = document.getElementById("checkItems");
    const sub = document.getElementById("checkSub");
    if (!items.length) {
      root.innerHTML = `<div class="check-empty">Bag is empty. <a href="shop.html" style="color:#7eb6ff;text-decoration:underline">Shop now</a></div>`;
      sub.textContent = "$0.00";
      return;
    }
    let total = 0;
    root.innerHTML = items.map((i) => {
      total += i.price * i.qty;
      return `<div class="check-line" data-id="${i.id}">
        <div>
          <div>${i.name}</div>
          <div class="qty" style="margin-top:.4rem;display:flex;gap:.35rem;align-items:center">
            <button type="button" data-d="-1" style="width:28px;height:28px;border-radius:6px;border:1px solid var(--line-soft)">−</button>
            <span>${i.qty}</span>
            <button type="button" data-d="1" style="width:28px;height:28px;border-radius:6px;border:1px solid var(--line-soft)">+</button>
          </div>
        </div>
        <strong>${money(i.price * i.qty)}</strong>
      </div>`;
    }).join("");
    sub.textContent = money(total);
    root.querySelectorAll(".check-line").forEach((row) => {
      row.querySelectorAll("[data-d]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const id = row.getAttribute("data-id");
          const item = window.PGBCart.read().find((x) => x.id === id);
          if (!item) return;
          const next = item.qty + Number(btn.getAttribute("data-d"));
          const items2 = window.PGBCart.read().map((x) => x.id === id ? { ...x, qty: next } : x).filter((x) => x.qty > 0);
          localStorage.setItem("pgb-cart-v1", JSON.stringify(items2));
          window.PGBCart.render();
          render();
        });
      });
    });
  }
  document.getElementById("checkForm")?.addEventListener("submit", (e) => {
    e.preventDefault();
    localStorage.setItem("pgb-cart-v1", "[]");
    window.PGBCart?.render();
    render();
    document.getElementById("checkDone").hidden = false;
  });
  document.addEventListener("DOMContentLoaded", () => setTimeout(render, 0));
  window.addEventListener("pgb-cart", render);
})();
</script>
</body>
</html>
