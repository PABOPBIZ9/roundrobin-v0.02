<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch — Condensed Game | PuckGold</title>
<meta name="description" content="Watch PuckGold condensed games — full-game action in a tight cut.">
<script>(function(){try{var t=localStorage.getItem("pgb-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);else if(window.matchMedia("(prefers-color-scheme: light)").matches)document.documentElement.setAttribute("data-theme","light");}catch(e){}})();</script>
<link rel="stylesheet" href="assets/css/site.css?v=49">
<link rel="stylesheet" href="assets/css/nhl-league.css?v=3">
<link rel="icon" href="assets/brand/favicon/favicon.ico?v=3" type="image/x-icon">
<style>
  .vw-player{
    background:#0b1220;border-radius:14px;overflow:hidden;aspect-ratio:16/9;
    display:grid;place-items:center;position:relative;color:#fff;
  }
  .vw-player video{width:100%;height:100%;object-fit:contain;background:#000}
  .vw-player .placeholder{
    text-align:center;padding:2rem;max-width:28rem;
  }
  .vw-player .placeholder .play-btn{margin:0 auto 1rem}
  .vw-meta{margin-top:1.1rem}
  .vw-meta h1{font-family:var(--display);font-size:clamp(1.8rem,5vw,2.8rem);letter-spacing:.04em}
  .vw-meta p{color:#5c6473;margin-top:.45rem;max-width:40rem}
  .vw-actions{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:1rem}
  .vw-next{margin-top:2rem}
  .vw-next h2{font-family:var(--display);font-size:1.8rem;letter-spacing:.04em;margin-bottom:.85rem}
</style>
</head>
<body class="nhl-light">
<div class="ice-lines"></div>
<header class="site-header" id="site-header"></header>

<nav class="nhl-sub" aria-label="Video">
  <a href="video-condensed.html" class="is-active">Condensed Games</a>
  <a href="video-recaps.html">Game Recaps</a>
  <a href="puck-personality.html">Puck Personality</a>
  <a href="podcasts.html">Podcasts</a>
  <a href="media-videos.html">All video</a>
</nav>

<div class="nhl-wrap nhl-wrap-wide" id="vwRoot"></div>
<footer class="site-footer" id="site-footer"></footer>
<script src="assets/js/i18n.js?v=1"></script>
<script src="assets/js/site.js?v=49"></script>
<script src="assets/js/support-widget.js?v=5"></script>
<script src="assets/js/cart.js?v=8"></script>
<script src="assets/js/teams-data.js?v=2"></script>
<script src="assets/js/standings-data.js?v=2"></script>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  const type = params.get("type") || "condensed"; // condensed | recap
  const id = params.get("gameid") || window.PGB_GAMES.find((g) => g.status === "final")?.id;
  const bySlug = Object.fromEntries(window.PGBTeams.all().map((t) => [t.slug, t]));
  const g = window.PGB_GAMES.find((x) => x.id === id) || window.PGB_GAMES[0];
  const home = bySlug[g.home];
  const away = bySlug[g.away];
  const folder = type === "recap" ? "recaps" : "condensed";
  const base = `assets/vault/content/${folder}/${g.id}`;
  const title = `${away.short} at ${home.short} | ${type === "recap" ? "Recap" : "Condensed Game"}`;
  document.title = title + " | PuckGold";

  const others = window.PGB_GAMES.filter((x) => x.status === "final" && x.id !== g.id)
    .sort((a, b) => (a.date < b.date ? 1 : -1))
    .slice(0, 6);

  const root = document.getElementById("vwRoot");
  root.innerHTML = `
    <div class="vw-player" id="vwPlayer">
      <video id="vwVideo" controls playsinline poster="${base}/thumb.jpg" hidden>
        <source src="${base}/film.mp4" type="video/mp4">
      </video>
      <div class="placeholder" id="vwPh">
        <div class="play-btn" aria-hidden="true"></div>
        <div class="tag" style="color:#f0d78c;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;font-weight:800">Next video in vault</div>
        <h2 style="font-family:var(--display);font-size:1.8rem;letter-spacing:.04em;margin:.4rem 0">${title}</h2>
        <p style="color:rgba(255,255,255,.7);font-size:.9rem">Drop <code style="color:#f0d78c">${base}/film.mp4</code> (and optional <code style="color:#f0d78c">thumb.jpg</code>) to play — PGB condensed watch page.</p>
      </div>
    </div>
    <div class="vw-meta">
      <div class="eyebrow" style="font-size:.68rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#8a93a3">${g.date} · ${g.round}</div>
      <h1>${title}</h1>
      <p>Watch full-game highlights from the Founding Four matchup between ${away.name} and ${home.name}, condensing the action into a ${type === "recap" ? "5" : "10"}-minute cut. ${g.score}${g.series ? " · " + g.series : ""}.</p>
      ${(g.threeStars || []).length ? `<p><strong style="color:#0b1220">Three stars:</strong> ${g.threeStars.join(" · ")}</p>` : ""}
      <div class="vw-actions">
        <a class="pz-btn" href="scores.html" style="text-decoration:none;background:#0b1220;color:#fff;border-radius:999px;padding:.7em 1.15em;font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase">Scores</a>
        <a class="pz-btn" href="lv-game.html?gameid=${g.id}" style="text-decoration:none;background:transparent;color:#163a74;border:1px solid rgba(22,58,116,.28);border-radius:999px;padding:.7em 1.15em;font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase">LockerVision</a>
        <a class="pz-btn" href="video-${folder === "recaps" ? "recaps" : "condensed"}.html" style="text-decoration:none;background:transparent;color:#163a74;border:1px solid rgba(22,58,116,.28);border-radius:999px;padding:.7em 1.15em;font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase">All ${folder}</a>
      </div>
    </div>
    <div class="vw-next">
      <h2>Next in ${type === "recap" ? "Game Recaps" : "Condensed Games"}</h2>
      <div class="vid-grid">
        ${others
          .map((x) => {
            const h = bySlug[x.home];
            const a = bySlug[x.away];
            return `
            <a class="vid-card" href="video-watch.html?type=${type}&gameid=${x.id}" style="text-decoration:none;color:inherit">
              <div class="vid-thumb" style="background:linear-gradient(145deg,${a.colorDeep},${h.colorDeep})">
                <div class="play-btn" aria-hidden="true"></div>
                <span class="dur">${type === "recap" ? "~5:00" : "~10:00"}</span>
              </div>
              <div class="vid-cap">
                <div class="eyebrow">${x.date}</div>
                <h3>${a.short} at ${h.short} | ${type === "recap" ? "Recap" : "Condensed Game"}</h3>
                <p>${x.score}</p>
              </div>
            </a>`;
          })
          .join("")}
      </div>
    </div>
  `;

  const video = document.getElementById("vwVideo");
  const ph = document.getElementById("vwPh");
  fetch(base + "/film.mp4", { method: "HEAD" })
    .then((r) => {
      if (r.ok) {
        video.hidden = false;
        ph.hidden = true;
      }
    })
    .catch(() => {});
})();
</script>
</body>
</html>
