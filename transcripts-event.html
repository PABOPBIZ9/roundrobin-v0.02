<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Event Transcripts — PuckGold</title>
<script>(function(){try{var t=localStorage.getItem("pgb-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);else if(window.matchMedia("(prefers-color-scheme: light)").matches)document.documentElement.setAttribute("data-theme","light");}catch(e){}})();</script>
<link rel="stylesheet" href="assets/css/site.css?v=58">
<link rel="stylesheet" href="assets/css/media-hub.css?v=3">
<link rel="stylesheet" href="assets/css/transcripts.css?v=1">
<link rel="icon" href="assets/brand/favicon/favicon.ico?v=3" type="image/x-icon">
</head>
<body class="mh-page tr-light" data-mh="transcripts">
<div class="ice-lines"></div>
<header class="site-header" id="site-header"></header>
<div class="mh-subnav" id="mhSubnav"></div>
<div class="tr-wrap" id="trRoot"></div>
<footer class="site-footer" id="site-footer"></footer>
<script src="assets/js/i18n.js?v=1"></script>
<script src="assets/js/site.js?v=58"></script>
<script src="assets/js/support-widget.js?v=8"></script>
<script src="assets/js/cart.js?v=8"></script>
<script src="assets/js/media-hub.js?v=3"></script>
<script src="assets/js/transcripts-data.js?v=1"></script>
<script>
(function () {
  const id = new URLSearchParams(location.search).get("event") || "s1-golden-final";
  const ev = window.PGBTranscripts.event(id);
  const list = window.PGBTranscripts.forEvent(id);
  document.title = `${ev?.num || ""} ${ev?.name || "Event"} — Transcripts | PuckGold`;

  const byDate = {};
  list.forEach((t) => {
    (byDate[t.date] = byDate[t.date] || []).push(t);
  });

  document.getElementById("trRoot").innerHTML = `
    <div class="tr-head" style="display:flex;flex-wrap:wrap;gap:1rem;align-items:center">
      <div class="tr-roundel" style="width:96px;box-shadow:0 0 0 3px ${ev.accent}44">
        <img src="${ev.logo}" alt="" width="96" height="96">
      </div>
      <div>
        <div style="font-size:.68rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#8a93a3">${ev.num} · PUCK GOLD</div>
        <h1>${ev.name}</h1>
        <p>${ev.dates} · ${ev.city} · ${ev.venue}</p>
        <p style="margin-top:.35rem"><a href="transcripts.html" style="color:#163a74;font-weight:800;font-size:.8rem">← All events</a>
        ${ev.id === "expansion-weekend" ? ' · <a href="expansion.html" style="color:#163a74;font-weight:800;font-size:.8rem">Countdown</a>' : ""}</p>
      </div>
    </div>
    ${Object.keys(byDate)
      .sort((a, b) => (a < b ? 1 : -1))
      .map((date) => {
        const rows = byDate[date]
          .sort((a, b) => (a.time < b.time ? 1 : -1))
          .map(
            (t) => `
          <div class="tr-row">
            <div class="time">${t.time.slice(0, 5)}</div>
            <div>
              <h3><a href="transcript.html?id=${t.id}">${t.team} — ${t.type}</a></h3>
              <div class="who">${t.speakers.join(", ")}</div>
            </div>
            <div class="tr-links">
              <a href="transcript.html?id=${t.id}">HTML</a>
              <a href="assets/vault/content/transcripts/${t.event}/${t.id}.pdf">PDF</a>
            </div>
          </div>`
          )
          .join("");
        return `<div class="tr-day">${date}</div>${rows}`;
      })
      .join("") || `<p style="color:#5c6473">No transcripts yet — drop sessions into the vault.</p>`}
    <p style="margin-top:1.5rem;font-size:.78rem;color:#8a93a3">FastScripts-style desk · Drop PDF as <code>assets/vault/content/transcripts/${id}/{id}.pdf</code></p>
  `;
})();
</script>
</body>
</html>
