<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Vault — PuckGold</title>
<script>(function(){try{var t=localStorage.getItem("pgb-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);else if(window.matchMedia("(prefers-color-scheme: light)").matches)document.documentElement.setAttribute("data-theme","light");}catch(e){}})();</script>
<link rel="stylesheet" href="assets/css/site.css?v=86">
<link rel="stylesheet" href="assets/css/teams.css?v=6">
<link rel="icon" href="assets/brand/favicon/favicon.ico?v=3" type="image/x-icon">
<style>
  .tv-hero{padding:2rem 4vw 1.25rem;max-width:1200px;margin:0 auto}
  .tv-hero h1{font-family:var(--display);font-size:clamp(2rem,6vw,3.2rem);letter-spacing:.03em;margin:.35rem 0}
  .tv-mark{
    width:72px;height:72px;border-radius:14px;display:grid;place-items:center;
    font-family:var(--display);font-size:2rem;color:#fff;margin-bottom:.75rem;
    box-shadow:0 8px 24px rgba(0,0,0,.25);
  }
  .tv-back{font-size:.78rem;font-weight:700;color:#163a74;text-decoration:underline;text-underline-offset:3px}
  .tv-wrap{max-width:1200px;margin:0 auto;padding:0 4vw 3rem}
  .tv-grid{display:grid;gap:.75rem;grid-template-columns:1fr}
  @media(min-width:640px){.tv-grid{grid-template-columns:1fr 1fr}}
  @media(min-width:960px){.tv-grid.cols-3{grid-template-columns:repeat(3,1fr)}}
  .tv-card{
    background:#fff;border:1px solid rgba(18,24,38,.08);border-radius:14px;padding:1.1rem;
    display:flex;flex-direction:column;gap:.45rem;min-height:110px;
  }
  .tv-card h3{font-size:1rem;margin:0}
  .tv-card p{font-size:.84rem;color:#5c6473;line-height:1.45;margin:0;flex:1}
  .tv-card .tag{font-size:.6rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#8a93a3}
  .tv-card a,.tv-card button.linkish{
    font-size:.78rem;font-weight:800;color:#163a74;text-decoration:underline;text-underline-offset:3px;
    background:none;border:0;padding:0;cursor:pointer;text-align:left;font-family:inherit;
  }
  .tv-card.missing{border-style:dashed;background:#f8fafc}
  .tv-card.live{border-color:rgba(22,58,116,.22)}
  .tv-swatch-row{display:flex;gap:.5rem;margin:1rem 0}
  .tv-swatch{flex:1;min-height:56px;border-radius:10px;display:flex;align-items:flex-end;padding:.4rem .5rem;font-size:.62rem;font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35)}
  .tv-actions{display:flex;flex-wrap:wrap;gap:.45rem;margin:1rem 0 1.25rem}
  .tv-note{
    background:#fff;border:1px solid rgba(18,24,38,.08);border-radius:14px;padding:1rem 1.15rem;
    font-size:.86rem;color:#5c6473;line-height:1.5;margin-top:1rem;
  }
  .tv-note code{font-size:.78rem;color:#163a74}
  .tv-readme{white-space:pre-wrap;font-size:.84rem;color:#3a4250;margin-top:.5rem}
</style>
</head>
<body class="tp-page">
<div class="ice-lines"></div>
<header class="site-header" id="site-header"></header>
<div id="tvRoot"></div>
<footer class="site-footer" id="site-footer"></footer>
<script src="assets/js/i18n.js?v=2"></script>
<script src="assets/js/site.js?v=80"></script>
<script src="assets/js/support-widget.js?v=15"></script>
<script src="assets/js/teams-data.js?v=4"></script>
<script src="assets/js/team-vault.js?v=1"></script>
<script>
(async function () {
  const params = new URLSearchParams(location.search);
  const slug = params.get("team") || "miami-mighty-geckz";
  const sectionId = params.get("section") || "02-Brand-Kit";
  const team = window.PGBTeams.bySlug(slug) || window.PGBTeams.all()[0];
  const section = window.PGBTeamVault.section(sectionId) || window.PGBTeamVault.section("02-Brand-Kit");
  const root = document.getElementById("tvRoot");
  const teamPage = `team.html?team=${encodeURIComponent(team.slug)}`;
  const vaultBase = `${team.folder}${sectionId}/`;

  document.title = `${team.name} · ${section.title} — Team Vault | PuckGold`;

  let readme = "";
  try {
    const res = await fetch(`${vaultBase}README.md`);
    if (res.ok) readme = await res.text();
  } catch (_) {}

  if (section.teamAnchor) {
    location.replace(`${teamPage}#${section.teamAnchor}`);
    return;
  }

  const subs = section.subs ? await window.PGBTeamVault.listSubAssets(team, sectionId, section.subs) : [];

  const subCards = subs
    .map((s) => {
      if (s.ok) {
        const fileName = section.subs.find((x) => x.label === s.label)?.file || s.file;
        const href = s.isFolder ? window.PGBTeamVault.vaultUrl(team.slug, sectionId) : vaultBase + fileName;
        return `<article class="tv-card live"><div class="tag">Live asset</div><h3>${s.label}</h3><p>Available in team vault.</p><a href="${href}" ${s.isFolder ? "" : "download"}>${s.isFolder ? "Open section" : "Download →"}</a></article>`;
      }
      return `<article class="tv-card missing"><div class="tag">Drop zone</div><h3>${s.label}</h3><p>Drop files into <code>${vaultBase}${s.file}</code></p></article>`;
    })
    .join("");

  const allSections = Object.entries(window.PGBTeamVault.sections)
    .map(
      ([id, s]) =>
        `<a class="tp-btn ghost" href="${window.PGBTeamVault.vaultUrl(team.slug, id)}"${id === sectionId ? ' style="border-color:var(--gold);color:var(--gold-deep)"' : ""}>${s.title}</a>`
    )
    .join("");

  root.innerHTML = `
    <section class="tv-hero">
      <a class="tv-back" href="${teamPage}">← ${team.name}</a>
      <div class="tv-mark" style="background:linear-gradient(145deg,${team.color},${team.colorDeep})">${team.mono}</div>
      <span class="kicker">${team.code} · Vault · ${sectionId}</span>
      <h1>${section.title.toUpperCase()}</h1>
      <p style="color:#5c6473;max-width:36rem;margin-top:.35rem">${section.desc}</p>
      <div class="tv-swatch-row">
        <div class="tv-swatch" style="background:${team.color}">${team.color}</div>
        <div class="tv-swatch" style="background:${team.colorDeep}">${team.colorDeep}</div>
      </div>
      <div class="tv-actions">
        <a class="btn btn-og btn-sm" href="${teamPage}#vault">All vault folders</a>
        <a class="btn btn-platinum btn-sm" href="brand.html">League brand kit</a>
        <a class="btn btn-ghost btn-sm" href="brand-factory/studio.html">Brand Factory</a>
        <a class="btn btn-ghost btn-sm" href="media-resources.html">Media resources</a>
      </div>
    </section>
    <div class="tv-wrap">
      <h2 style="font-family:var(--display);font-size:1.35rem;letter-spacing:.03em;margin-bottom:.65rem">Assets</h2>
      <div class="tv-grid${subs.length > 2 ? " cols-3" : ""}">${subCards || `<article class="tv-card"><div class="tag">Vault</div><h3>${section.title}</h3><p>Use the team page for live stadium video, roster, and audio.</p><a href="${teamPage}">Open team page →</a></article>`}</div>
      ${
        (section.extraLinks || [])
          .map((l) => `<p style="margin-top:.85rem"><a href="${l.href}" style="font-weight:800;color:#163a74">${l.label} →</a></p>`)
          .join("") || ""
      }
      ${readme ? `<div class="tv-note"><strong style="color:#0b1220">Vault readme</strong><div class="tv-readme">${readme.replace(/^#+\s.*\n?/m, "").trim()}</div></div>` : ""}
      <div class="tv-note">
        <strong style="color:#0b1220">Source folder</strong> —
        Drop finals into <code>${vaultBase}</code>. The site serves files from this path; folder browsing is not enabled on production — use this page or download links instead.
      </div>
      <h2 style="font-family:var(--display);font-size:1.15rem;letter-spacing:.03em;margin:1.5rem 0 .65rem">All vault sections</h2>
      <div class="tv-actions">${allSections}</div>
    </div>
  `;
})();
</script>
</body>
</html>
