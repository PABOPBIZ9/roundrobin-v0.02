<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Outfit — LockerVision | PuckGold</title>
<meta name="description" content="Uniform story — jersey, pads, helmet, and ice rink details for a PuckGold kit edition.">
<script>(function(){try{var t=localStorage.getItem("pgb-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);else if(window.matchMedia("(prefers-color-scheme: light)").matches)document.documentElement.setAttribute("data-theme","light");}catch(e){}})();</script>
<link rel="stylesheet" href="assets/css/site.css?v=28">
<link rel="stylesheet" href="assets/css/lockervision.css?v=2">
<meta name="theme-color" content="#0a0c10">
<link rel="icon" href="assets/brand/favicon/favicon.ico?v=3" type="image/x-icon">
</head>
<body class="lv-body">
<div class="ice-lines"></div>
<header class="site-header" id="site-header"></header>
<div id="lvSubnav"></div>
<div id="lvTeamBar"></div>
<div class="lv-wrap lv-wrap-wide" id="lvRoot"></div>
<footer class="site-footer" id="site-footer"></footer>
<script src="assets/js/i18n.js?v=1"></script>
<script src="assets/js/site.js?v=28"></script>
<script src="assets/js/support-widget.js?v=2"></script>
<script src="assets/js/cart.js?v=6"></script>
<script src="assets/js/teams-data.js?v=2"></script>
<script src="assets/js/standings-data.js?v=2"></script>
<script src="assets/js/lockervision-data.js?v=2"></script>
<script src="assets/js/lockervision.js?v=2"></script>
<script>
(function () {
  const UI = window.PGBLVUI;
  const LV = window.PGBLockerVision;
  const params = new URLSearchParams(location.search);
  const slug = params.get("team") || "miami-mighty-geckz";
  const kitId = params.get("kit") || "home";
  const team = LV.teamBySlug(slug) || window.PGBTeams.all()[0];
  const kit = LV.kitFor(team.slug, kitId);
  const ed = LV.editions.find((e) => e.id === kitId);
  const paths = LV.paths(team.slug, kitId);
  const slots = kitId === "goalie" ? LV.goalieSlots : LV.gearSlots;

  document.title = `${team.short} — ${kit?.name || kitId} · LockerVision`;
  document.getElementById("lvSubnav").innerHTML = UI.subnav("editions");
  document.getElementById("lvTeamBar").innerHTML = UI.teamFilterBar(team.slug);

  const relatedGames = LV.gamesForTeam(team.slug).filter((g) => {
    const eg = LV.enrichGame(g);
    return (g.home === team.slug && eg.homeKit === kitId) || (g.away === team.slug && eg.awayKit === kitId);
  });

  document.getElementById("lvRoot").innerHTML = `
    <div class="lv-detail">
      <div>
        <div class="lv-main-card">
          <div class="lv-main-visual">
            <img id="lvHeroImg" alt="" hidden>
            <div class="lv-kit-fallback" id="lvHeroFall">${UI.kitSilhouette(team, kit)}</div>
          </div>
          <div class="lv-rink-panel">
            <h4>Center-ice stage · ${team.arena}</h4>
            ${UI.rinkSvg(team)}
          </div>
        </div>
      </div>
      <div class="lv-info">
        <span class="lv-kit-badge" style="background:${team.colorDeep};position:static;transform:none;display:inline-block;margin:0 0 .5rem">${team.name}</span>
        <div style="font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.45)">${ed?.name || kitId} · ${ed?.nbaAnalog || ""} analog</div>
        <h2>${kit?.name || kitId}</h2>
        <div class="lv-actions">
          <a href="lv-team.html?team=${encodeURIComponent(team.slug)}">← Team locker</a>
          <a href="lv-edition.html?edition=${kitId}">All ${ed?.name || kitId}</a>
          <a class="primary" href="shop.html?filter=${encodeURIComponent(team.shopFilter || "")}">Shop</a>
        </div>
        <p>${kit?.story || ""}</p>
        <p style="margin-top:.75rem;font-size:.85rem">${ed?.blurb || ""}</p>

        <div class="lv-section-head" style="margin-top:1.5rem">
          <h2 style="font-size:1.15rem">Layers</h2>
        </div>
        <div class="lv-gear-grid" id="lvGear"></div>

        ${
          relatedGames.length
            ? `<div class="lv-section-head" style="margin-top:1.5rem"><h2 style="font-size:1.15rem">Worn in</h2></div>
               <div class="lv-game-grid">${relatedGames.map((g) => UI.gameCardHTML(g)).join("")}</div>`
            : ""
        }

        <div class="lv-drop-note">
          Drop files into <code>${paths.hero.replace("/hero.png", "/")}</code><br>
          <code>hero.png</code> · <code>jersey.png</code> · <code>pads.png</code> · <code>helmet.png</code> · <code>gloves.png</code> · <code>pants.png</code> · <code>skates.png</code>
        </div>
      </div>
    </div>
    ${UI.mobileDock([
      { href: `lv-team.html?team=${encodeURIComponent(team.slug)}`, label: "Team locker" },
      { href: `shop.html?filter=${encodeURIComponent(team.shopFilter || "")}`, label: "Shop", primary: true },
    ])}
  `;

  UI.resolveKitHero(team.slug, kitId, null, null, document.getElementById("lvHeroImg"), document.getElementById("lvHeroFall"));

  const gear = document.getElementById("lvGear");
  gear.innerHTML = slots
    .map(
      (s) => `
      <div class="lv-gear" data-src="${paths[s.id]}">
        <span class="tag">${s.label}</span>
        <div class="swatch" style="background:linear-gradient(145deg,${kit?.accent},${kit?.shell})"></div>
        <img alt="" hidden>
        <strong>${s.label}</strong>
      </div>`
    )
    .join("");
  gear.querySelectorAll(".lv-gear").forEach((el) => {
    const img = el.querySelector("img");
    const sw = el.querySelector(".swatch");
    UI.tryImages([el.dataset.src], (src) => {
      img.src = src;
      img.hidden = false;
      if (sw) sw.hidden = true;
    });
  });
})();
</script>
</body>
</html>
