<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 Rosters — PuckGold Media Hub</title>
<meta name="description" content="PuckGold 2026 Founding Four roster sheet for press — LIV-style team rows with player marks.">
<script>(function(){try{var t=localStorage.getItem("pgb-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);else if(window.matchMedia("(prefers-color-scheme: light)").matches)document.documentElement.setAttribute("data-theme","light");}catch(e){}})();</script>
<link rel="stylesheet" href="assets/css/site.css?v=88">
<link rel="stylesheet" href="assets/css/media-hub.css?v=4">
<link rel="icon" href="assets/brand/favicon/favicon.ico?v=3" type="image/x-icon">
<style>
  .mr-sheet{background:#fff;border:1px solid rgba(18,24,38,.08);border-radius:14px;padding:1.25rem;margin-bottom:1rem}
  .mr-row{
    display:grid;gap:.75rem;align-items:center;padding:1rem 0;
    border-bottom:1px solid rgba(18,24,38,.06);
  }
  .mr-row:last-child{border-bottom:none}
  @media(min-width:900px){
    .mr-row{grid-template-columns:100px 1fr}
  }
  .mr-team{
    display:flex;flex-direction:column;align-items:flex-start;gap:.35rem;
  }
  .mr-mono{
    width:56px;height:56px;border-radius:12px;display:grid;place-items:center;
    font-family:var(--display);font-size:1.6rem;color:#fff;
  }
  .mr-team strong{font-size:.85rem}
  .mr-team span{font-size:.68rem;color:#8a93a3;letter-spacing:.08em;text-transform:uppercase;font-weight:800}
  .mr-players{
    display:grid;gap:.55rem;grid-template-columns:repeat(2,1fr);
  }
  @media(min-width:700px){.mr-players{grid-template-columns:repeat(3,1fr)}}
  @media(min-width:1100px){.mr-players{grid-template-columns:repeat(5,1fr)}}
  .mr-p{
    text-align:center;text-decoration:none;color:inherit;
  }
  .mr-hex{
    clip-path:polygon(12% 0,100% 0,88% 100%,0 100%);
    aspect-ratio:.85;display:grid;place-items:center;color:#fff;
    font-family:var(--display);font-size:1.4rem;letter-spacing:.04em;
    margin-bottom:.35rem;
  }
  .mr-p b{display:block;font-size:.72rem;letter-spacing:.04em;text-transform:uppercase}
  .mr-p i{font-style:normal;font-size:.65rem;color:#8a93a3;font-weight:700}
</style>
</head>
<body class="mh-page" data-mh="resources">
<div class="ice-lines"></div>
<header class="site-header" id="site-header"></header>
<div class="mh-subnav" id="mhSubnav"></div>

<section class="mh-page-hero">
  <h1>2026 ROSTER</h1>
</section>

<div class="mh-wrap">
  <p class="mh-legal">
    Founding Four press roster sheet — editorial use only. Drop print PDF as <code>PuckGold-2026-Rosters.pdf</code> in <code>assets/media-hub/DROP-DOCS-HERE/</code>.
    Press roster art for Season One. Fan-facing cards also on <a href="rosters.html" style="color:#163a74">rosters.html</a>.
  </p>

  <div class="mr-sheet" id="mrRoot"></div>

  <div class="cta-row">
    <a href="fact-sheet.html" class="mh-acred">League Fact Sheet</a>
    <a href="rosters.html" class="mh-viewall">Interactive rosters</a>
    <a href="transcripts.html" class="mh-viewall">Transcripts</a>
    <a href="assets/media-hub/DROP-DOCS-HERE/" class="mh-viewall">PDF vault</a>
  </div>
</div>

<footer class="site-footer" id="site-footer"></footer>
<script src="assets/js/i18n.js?v=1"></script>
<script src="assets/js/site.js?v=88"></script>
<script src="assets/js/support-widget.js?v=12"></script>
<script src="assets/js/cart.js?v=11"></script>
<script src="assets/js/media-catalog.js?v=1"></script>
<script src="assets/js/media-hub.js?v=6"></script>
<script src="assets/js/teams-data.js?v=9"></script>
<script src="assets/js/expansion-teams-data.js?v=1"></script>
<script>
(function () {
  document.getElementById("mrRoot").innerHTML = window.PGBTeams.all()
    .map((t) => {
      // Show first 5 for sheet density; full 9 linked
      const shown = t.players.slice(0, 5);
      return `
      <div class="mr-row">
        <div class="mr-team">
          <div class="mr-mono" style="background:${t.colorDeep}">${t.mono}</div>
          <strong>${t.name}</strong>
          <span>${t.code} · ${t.city}</span>
          <a href="team.html?team=${t.slug}" style="font-size:.72rem;font-weight:800;color:#163a74;margin-top:.25rem">Team vault →</a>
        </div>
        <div class="mr-players">
          ${shown
            .map(
              (p) => `
            <a class="mr-p" href="player.html?id=${p.id}">
              <div class="mr-hex" style="background:linear-gradient(145deg,${t.color},${t.colorDeep})">#${p.num}</div>
              <b>${p.name}</b>
              <i>${p.pos}${p.role === "Captain" ? " · C" : ""}</i>
            </a>`
            )
            .join("")}
          ${
            t.players.length > 5
              ? `<a class="mr-p" href="team.html?team=${t.slug}#roster"><div class="mr-hex" style="background:#eef1f6;color:#163a74">+${t.players.length - 5}</div><b>Full 9</b><i>Open roster</i></a>`
              : ""
          }
        </div>
      </div>`;
    })
    .join("");
})();
</script>
</body>
</html>
