<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schedule — PuckGold</title>
<meta name="description" content="PuckGold game schedule — round robin, semifinals, Golden Final, and Season Two Opening Faceoff.">
<script>(function(){try{var t=localStorage.getItem("pgb-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);else if(window.matchMedia("(prefers-color-scheme: light)").matches)document.documentElement.setAttribute("data-theme","light");}catch(e){}})();</script>
<link rel="stylesheet" href="assets/css/site.css?v=48">
<link rel="stylesheet" href="assets/css/nhl-league.css?v=1">
<link rel="icon" href="assets/brand/favicon/favicon.ico?v=3" type="image/x-icon">
</head>
<body class="nhl-light">
<div class="ice-lines"></div>
<header class="site-header" id="site-header"></header>

<section class="nhl-hero">
  <span class="kicker">Full slate</span>
  <h1>SCHEDULE</h1>
  <p>Founding Four game calendar — filter by round. Media nights live under Media Hub.</p>
</section>
<nav class="nhl-sub" aria-label="League">
  <a href="scores.html">Scores</a>
  <a href="schedule.html" class="is-active">Schedule</a>
  <a href="standings.html">Standings</a>
  <a href="stats.html">Stats</a>
  <a href="bracket.html">Playoffs</a>
  <a href="media-schedule.html">Media events</a>
</nav>

<div class="nhl-wrap nhl-wrap-wide">
  <div class="pz-tabs" id="schFilter" style="margin-bottom:1rem;display:flex;flex-wrap:wrap;gap:.4rem">
    <button type="button" class="is-active" data-round="all" style="border-radius:999px;padding:.55rem 1rem;font-size:.72rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;background:#0b1220;color:#fff">All</button>
    <button type="button" data-round="Round Robin" style="border-radius:999px;padding:.55rem 1rem;font-size:.72rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#5c6473;background:#fff;border:1px solid rgba(18,24,38,.08)">Round Robin</button>
    <button type="button" data-round="Semifinal" style="border-radius:999px;padding:.55rem 1rem;font-size:.72rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#5c6473;background:#fff;border:1px solid rgba(18,24,38,.08)">Semifinals</button>
    <button type="button" data-round="Golden Final" style="border-radius:999px;padding:.55rem 1rem;font-size:.72rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#5c6473;background:#fff;border:1px solid rgba(18,24,38,.08)">Golden Final</button>
    <button type="button" data-round="Season Two" style="border-radius:999px;padding:.55rem 1rem;font-size:.72rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#5c6473;background:#fff;border:1px solid rgba(18,24,38,.08)">Season Two</button>
  </div>
  <div class="sch-scroll">
    <table class="sch-table">
      <thead>
        <tr>
          <th>Date</th>
          <th>Time</th>
          <th>Matchup</th>
          <th>Venue</th>
          <th>Round</th>
          <th>Result</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="schBody"></tbody>
    </table>
  </div>
</div>

<footer class="site-footer" id="site-footer"></footer>
<script src="assets/js/i18n.js?v=1"></script>
<script src="assets/js/site.js?v=48"></script>
<script src="assets/js/support-widget.js?v=5"></script>
<script src="assets/js/cart.js?v=8"></script>
<script src="assets/js/teams-data.js?v=2"></script>
<script src="assets/js/standings-data.js?v=2"></script>
<script>
(function () {
  const bySlug = Object.fromEntries(window.PGBTeams.all().map((t) => [t.slug, t]));
  const body = document.getElementById("schBody");
  let filter = "all";

  function render() {
    const games = [...window.PGB_GAMES]
      .filter((g) => filter === "all" || g.round === filter)
      .sort((a, b) => (a.date > b.date ? 1 : -1));
    body.innerHTML = games
      .map((g) => {
        const home = bySlug[g.home];
        const away = bySlug[g.away];
        return `<tr>
          <td>${g.date}</td>
          <td>${g.time}</td>
          <td class="sch-matchup">
            <a href="team.html?team=${away.slug}">${away.short}</a>
            @
            <a href="team.html?team=${home.slug}">${home.short}</a>
          </td>
          <td>${g.venue}</td>
          <td>${g.round}</td>
          <td><span class="sch-status ${g.status}">${g.status === "final" ? g.score : "Upcoming"}</span></td>
          <td><a href="scores.html" style="color:#163a74;font-weight:800;font-size:.75rem">SCORES</a>
            · <a href="lv-game.html?gameid=${g.id}" style="color:#163a74;font-weight:800;font-size:.75rem">OUTFIT</a></td>
        </tr>`;
      })
      .join("");
  }

  document.getElementById("schFilter").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-round]");
    if (!btn) return;
    filter = btn.dataset.round;
    document.querySelectorAll("#schFilter button").forEach((b) => {
      const on = b === btn;
      b.classList.toggle("is-active", on);
      b.style.background = on ? "#0b1220" : "#fff";
      b.style.color = on ? "#fff" : "#5c6473";
    });
    render();
  });
  render();
})();
</script>
</body>
</html>
