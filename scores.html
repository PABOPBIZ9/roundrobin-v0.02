<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scores — PuckGold</title>
<meta name="description" content="PuckGold scores — Founding Four final scores, three stars, recaps, and LockerVision outfits.">
<script>(function(){try{var t=localStorage.getItem("pgb-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);else if(window.matchMedia("(prefers-color-scheme: light)").matches)document.documentElement.setAttribute("data-theme","light");}catch(e){}})();</script>
<link rel="stylesheet" href="assets/css/site.css?v=46">
<link rel="stylesheet" href="assets/css/nhl-league.css?v=1">
<link rel="icon" href="assets/brand/favicon/favicon.ico?v=3" type="image/x-icon">
</head>
<body class="nhl-light">
<div class="ice-lines"></div>
<header class="site-header" id="site-header"></header>

<section class="nhl-hero">
  <span class="kicker">Underdog Division</span>
  <h1>SCORES</h1>
  <p>Every Founding Four result — finals, OT thrillers, and the next Opening Faceoff. Live PGB League scores.</p>
</section>
<nav class="nhl-sub" aria-label="League">
  <a href="scores.html" class="is-active">Scores</a>
  <a href="schedule.html">Schedule</a>
  <a href="standings.html">Standings</a>
  <a href="stats.html">Stats</a>
  <a href="bracket.html">Playoffs</a>
  <a href="video-recaps.html">Recaps</a>
  <a href="video-condensed.html">Condensed</a>
</nav>

<div class="nhl-wrap" id="scoresRoot"></div>
<footer class="site-footer" id="site-footer"></footer>
<script src="assets/js/i18n.js?v=1"></script>
<script src="assets/js/site.js?v=46"></script>
<script src="assets/js/support-widget.js?v=5"></script>
<script src="assets/js/cart.js?v=8"></script>
<script src="assets/js/teams-data.js?v=2"></script>
<script src="assets/js/standings-data.js?v=2"></script>
<script>
(function () {
  const bySlug = Object.fromEntries(window.PGBTeams.all().map((t) => [t.slug, t]));
  const games = [...window.PGB_GAMES].sort((a, b) => (a.date < b.date ? 1 : -1));
  const root = document.getElementById("scoresRoot");

  function row(team, score, oppScore, status) {
    if (!team) return "";
    const win = status === "final" && score != null && oppScore != null && score > oppScore;
    const lose = status === "final" && score != null && oppScore != null && score < oppScore;
    return `
      <div class="sc-row">
        <div class="sc-team">
          <span class="sc-mono" style="background:${team.colorDeep}">${team.mono}</span>
          <a href="team.html?team=${team.slug}">${team.short}</a>
        </div>
        <div class="sc-score ${win ? "win" : ""} ${lose ? "lose" : ""}">${score == null ? "—" : score}</div>
      </div>`;
  }

  const byDate = {};
  games.forEach((g) => {
    (byDate[g.date] = byDate[g.date] || []).push(g);
  });

  root.innerHTML = Object.keys(byDate)
    .sort((a, b) => (a < b ? 1 : -1))
    .map((date) => {
      const cards = byDate[date]
        .map((g) => {
          const home = bySlug[g.home];
          const away = bySlug[g.away];
          const badge =
            g.status === "upcoming"
              ? `<span>${g.time}</span>`
              : `<span class="final">Final${g.decided === "OT" ? "/OT" : ""}</span>`;
          return `
          <article class="sc-card">
            <div class="sc-card-top">
              <span>${g.round}</span>
              ${badge}
            </div>
            ${row(away, g.awayScore, g.homeScore, g.status)}
            ${row(home, g.homeScore, g.awayScore, g.status)}
            <div class="sc-foot">
              <span>${g.venue}</span>
              ${g.series ? `<span>${g.series}</span>` : ""}
              <a href="lv-game.html?gameid=${g.id}">Outfit</a>
              <a href="video-recaps.html#${g.id}">Recap</a>
              <a href="video-condensed.html#${g.id}">Condensed</a>
            </div>
          </article>`;
        })
        .join("");
      return `<div class="sc-day">${date}</div><div class="sc-grid">${cards}</div>`;
    })
    .join("");
})();
</script>
</body>
</html>
