<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apply for Accreditation — PuckGold Media Hub</title>
<script>(function(){try{var t=localStorage.getItem("pgb-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);else if(window.matchMedia("(prefers-color-scheme: light)").matches)document.documentElement.setAttribute("data-theme","light");}catch(e){}})();</script>
<link rel="stylesheet" href="assets/css/site.css?v=37">
<link rel="stylesheet" href="assets/css/media-hub.css?v=3">
<link rel="icon" href="assets/brand/favicon/favicon.ico?v=3" type="image/x-icon">
</head>
<body class="mh-page" data-mh="accreditation">
<div class="ice-lines"></div>
<header class="site-header" id="site-header"></header>
<div class="mh-subnav" id="mhSubnav"></div>

<section class="mh-page-hero">
  <h1>ACCREDITATION</h1>
</section>

<div class="mh-wrap">
  <p style="max-width:40rem;color:#5c6473;margin-bottom:1.4rem">Get on-site access to cover PuckGold tournaments as accredited media. Review <a href="media-guidelines.html" style="color:#163a74;text-decoration:underline">Media Guidelines</a> before applying.</p>

  <form class="mh-form" id="acredForm">
    <div class="fields">
      <div class="field"><label>Full name</label><input name="name" required></div>
      <div class="field"><label>Outlet / organization</label><input name="outlet" required></div>
      <div class="field"><label>Work email</label><input type="email" name="email" required></div>
      <div class="field"><label>Role</label>
        <select name="role" required>
          <option value="">Select…</option>
          <option>Writer / Editor</option>
          <option>Photographer</option>
          <option>Videographer</option>
          <option>Broadcaster</option>
          <option>Digital / Social</option>
          <option>Other</option>
        </select>
      </div>
      <div class="field"><label>Event(s)</label>
        <select name="event" required>
          <option value="">Select…</option>
          <option>Opening Faceoff — Miami</option>
          <option>Cardinal Clash — McLean</option>
          <option>District Showdown — Wash.</option>
          <option>Terminal Cup — Chatt.</option>
          <option>Founding Four Finals</option>
          <option>Season pass / multiple events</option>
        </select>
      </div>
      <div class="field"><label>Coverage plan</label><textarea name="plan" rows="4" placeholder="Platforms, audience, what you’ll publish…"></textarea></div>
      <button type="submit" class="mh-acred" style="border:none;cursor:pointer;width:100%;text-align:center">Submit application</button>
      <p style="font-size:.78rem;color:#8a93a3;margin-top:.6rem">Demo form — opens mailto to media@puckgold.com and stores a local copy.</p>
    </div>
    <p class="done">Application queued — check your mail client. We’ll confirm credentials before event week.</p>
  </form>
</div>

<footer class="site-footer" id="site-footer"></footer>
<script src="assets/js/i18n.js?v=1"></script>
<script src="assets/js/site.js?v=37"></script>
<script src="assets/js/support-widget.js?v=5"></script>
<script src="assets/js/cart.js?v=7"></script>
<script src="assets/js/media-hub.js?v=4"></script>
<script>
document.getElementById("acredForm")?.addEventListener("submit", (e) => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(e.target).entries());
  try { localStorage.setItem("pgb-acred", JSON.stringify({ ...data, at: Date.now() })); } catch (_) {}
  const subject = encodeURIComponent("PGB media accreditation — " + (data.outlet || ""));
  const body = encodeURIComponent(Object.entries(data).map(([k,v]) => k + ": " + v).join("\n"));
  e.target.classList.add("is-sent");
  window.location.href = "mailto:media@puckgold.com?subject=" + subject + "&body=" + body;
});
</script>
</body>
</html>
